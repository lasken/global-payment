      {id:'catering',svg:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>`,label:'Food Catering',color:'#16a34a'},
      {id:'energy',svg:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,label:'Energy & Power',color:'#f59e0b'},
      {id:'finance_pos',svg:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>`,label:'Finance / Cash / POS',color:'#10b981'},
    ];
    const NIGERIA=[
      'Abuja','Lagos','Ibadan','Kano','Port Harcourt','Benin City','Kaduna','Enugu',
      'Owerri','Abeokuta','Akure','Calabar','Uyo','Warri','Jos','Ilorin','Aba',
      'Asaba','Maiduguri','Zaria','Onitsha','Sokoto','Ile-Ife','Ado-Ekiti','Bauchi',
    ];
    const GLOBAL={
      'United States':['New York','Los Angeles','Chicago','Houston','Miami','Atlanta','Dallas','San Francisco','Seattle','Boston'],
      'United Kingdom':['London','Manchester','Birmingham','Leeds','Glasgow','Edinburgh','Liverpool','Bristol','Sheffield'],
      'Canada':['Toronto','Vancouver','Montreal','Calgary','Ottawa','Edmonton','Winnipeg','Halifax'],
      'Australia':['Sydney','Melbourne','Brisbane','Perth','Adelaide','Canberra','Gold Coast'],
      'South Africa':['Johannesburg','Cape Town','Durban','Pretoria','Port Elizabeth','Bloemfontein'],
      'Ghana':['Accra','Kumasi','Tamale','Cape Coast','Takoradi','Sunyani'],
      'Kenya':['Nairobi','Mombasa','Kisumu','Nakuru','Eldoret','Thika'],
      'India':['Mumbai','Delhi','Bangalore','Hyderabad','Chennai','Kolkata','Pune','Ahmedabad'],
      'UAE':['Dubai','Abu Dhabi','Sharjah','Ajman','Ras Al Khaimah'],
      'Germany':['Berlin','Munich','Hamburg','Frankfurt','Cologne','Stuttgart','Düsseldorf'],
      'France':['Paris','Lyon','Marseille','Toulouse','Nice','Nantes','Bordeaux'],
      'Brazil':['São Paulo','Rio de Janeiro','Brasília','Salvador','Fortaleza','Belo Horizonte'],
      'Singapore':['Singapore City'],
      'Japan':['Tokyo','Osaka','Kyoto','Yokohama','Nagoya','Sapporo','Fukuoka'],
      'China':['Shanghai','Beijing','Shenzhen','Guangzhou','Chengdu','Hangzhou','Wuhan'],
    };

    const selCat=S._vCat||null;
    const selCity=S._vCity||null;
    const selCountry=S._vCountry||'Nigeria';

    if(!selCat){
      return`<div style="animation:pup .28s ease">
        <p style="font-size:.875rem;color:var(--t2);margin-bottom:20px">Discover local businesses and services by category. Browse the directory, then vote for your favourite each quarter.</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px">
          ${VENDOR_CATS.map(c=>`
          <div onclick="A.setVendorCat('${c.id}')" style="background:var(--white);border:1.5px solid var(--bdr);border-radius:var(--rmd);padding:18px 16px;cursor:pointer;transition:var(--ease);display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px"
            onmouseover="this.style.borderColor='${c.color}';this.style.transform='translateY(-2px)';this.style.boxShadow='var(--s2)'"
            onmouseout="this.style.borderColor='var(--bdr)';this.style.transform='none';this.style.boxShadow='none'">
            <div style="width:42px;height:42px;border-radius:var(--rsm);background:${c.color}18;display:flex;align-items:center;justify-content:center;color:${c.color}">
              ${c.svg}
            </div>
            <span style="font-weight:600;font-size:.8125rem;color:var(--t1)">${c.label}</span>
          </div>`).join('')}
        </div>
      </div>`;
    }

    const cat=VENDOR_CATS.find(c=>c.id===selCat);
    const cities=selCountry==='Nigeria'?NIGERIA:(GLOBAL[selCountry]||[]);
    const isAdmin=S.user?.id===ADMIN_ID;

    return`<div style="animation:pup .28s ease">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap">
        <button class="back" style="margin:0" onclick="A.setVendorCat(null)"><i data-lucide="arrow-left" style="width:14px;height:14px"></i>Categories</button>
        <div style="display:flex;align-items:center;gap:7px;background:${cat.color}18;border:1.5px solid ${cat.color}44;border-radius:100px;padding:5px 14px 5px 8px">
          <span style="display:flex;align-items:center;color:${cat.color};width:15px;height:15px">${cat.svg.replace('width="20" height="20"','width="15" height="15"')}</span>
          <span style="font-weight:600;font-size:.875rem;color:${cat.color}">${cat.label}</span>
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px">
        <div style="flex:1;min-width:150px">
          <label style="font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);display:block;margin-bottom:6px">Country</label>
          <select onchange="A.setVendorCountry(this.value)" style="font-size:.875rem">
            <option value="Nigeria" ${selCountry==='Nigeria'?'selected':''}>🇳🇬 Nigeria</option>
            ${Object.keys(GLOBAL).map(c=>`<option value="${c}" ${selCountry===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div style="flex:1;min-width:150px">
          <label style="font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);display:block;margin-bottom:6px">City</label>
          <select onchange="A.setVendorCity(this.value)" style="font-size:.875rem">
            <option value="">Select a city…</option>
            ${cities.map(city=>`<option value="${city}" ${selCity===city?'selected':''}>${city}</option>`).join('')}
          </select>
        </div>
      </div>

      ${!selCity?`
      <div style="background:var(--off);border-radius:var(--rmd);padding:20px;text-align:center;color:var(--t3);font-size:.875rem;border:1.5px dashed var(--bdr)">
        <i data-lucide="map-pin" style="width:22px;height:22px;display:block;margin:0 auto 10px"></i>
        Select a city above to browse ${cat.label} vendors.
      </div>`:`

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
        <div style="font-weight:600;font-size:.95rem">${cat.label} in ${selCity}</div>
        ${S.user?`<button class="btn bp bsm" onclick="M.vendorSubmit('${selCat}','${selCity}','${cat.label}',false)"><i data-lucide="plus" style="width:12px;height:12px"></i>List My Business</button>`:`<button class="btn bo bsm" onclick="M.auth()"><i data-lucide="user-plus" style="width:12px;height:12px"></i>Sign in to list your business</button>`}
      </div>

      <div id="vendor-directory-root">
        ${P._vendorDirectoryBody(selCat,selCity,isAdmin)}
      </div>
      `}
    </div>`;
  },

  _vendorDirectoryBody(catId,city,isAdmin){
    const loading=S._vendorDirLoading;
    const list=S._vendorDirectory||[];
    if(loading){
      return`<div style="text-align:center;padding:48px;color:var(--t3)"><div class="spin"></div><br>Loading vendors…</div>`;
    }
    if(list.length===0){
      return`<div style="border:2px dashed var(--bdr2);border-radius:var(--rlg);padding:36px 24px;text-align:center">
        <div style="width:48px;height:48px;background:var(--surf);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--t3)"><i data-lucide="store" style="width:20px;height:20px"></i></div>
        <div style="font-family:var(--fd);font-size:1.1rem;color:var(--t2);margin-bottom:6px">No vendors listed here yet</div>
        <p style="font-size:.8125rem;color:var(--t3)">Be the first to add your business in this category and city.</p>
      </div>`;
    }
    const pick=list.find(v=>v.isCommunityPick);
    const rest=list.filter(v=>!v.isCommunityPick);
    return`
      ${pick?P._vendorPickCard(pick):''}
      <div style="display:flex;flex-direction:column;gap:14px;margin-top:${pick?'18px':'0'}">
        ${rest.map(v=>P._vendorCard(v,isAdmin)).join('')}
      </div>`;
  },

  _vendorPickCard(v){
    const logoUrl=v.logoId?fileUrl(v.logoId):null;
    const posterUrl=v.posterIds?.[0]?fileUrl(v.posterIds[0]):null;
    const waLink=vendorWaLink(v.whatsapp,v.bizName,v.category);
    return`<div style="border:2px solid var(--gld);border-radius:var(--rlg);overflow:hidden;background:var(--white)">
      <div style="background:linear-gradient(135deg,#FBF4E6,#fff8ed);padding:14px 18px;border-bottom:1px solid #E8D9B0;display:flex;align-items:center;gap:10px">
        <div style="width:30px;height:30px;border-radius:50%;background:var(--gld);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
        </div>
        <div style="font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gld)">Community Pick</div>
        <span class="tag tgd" style="font-size:.65rem;margin-left:auto">${v.votes||0} votes</span>
      </div>
      ${posterUrl?`<img src="${posterUrl}" style="width:100%;height:${window.innerWidth>768?'260px':'180px'};object-fit:cover;display:block;object-position:${v.coverFocus||'center center'}" onclick="event.stopPropagation();openLightbox([{url:'${posterUrl}',caption:''}],0)" style="cursor:zoom-in">`:''}
      <div style="padding:18px">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
          ${logoUrl?`<img src="${logoUrl}" style="width:48px;height:48px;border-radius:var(--rsm);object-fit:cover;border:1px solid var(--bdr);flex-shrink:0">`:`<div style="width:48px;height:48px;border-radius:var(--rsm);background:var(--surf);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--t3)"><i data-lucide="store" style="width:18px;height:18px"></i></div>`}
          <div>
            <div style="font-family:var(--fd);font-size:1.15rem">${v.bizName}</div>
            ${v.tagline?`<div style="font-size:.8rem;color:var(--t2)">${v.tagline}</div>`:''}
          </div>
        </div>
        ${v.about?`<div style="font-size:.8125rem;color:var(--t2);line-height:1.6;margin-bottom:12px">${v.about}</div>`:''}
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${waLink?`<a href="${waLink}" target="_blank" rel="noopener" class="btn bc bsm"><i data-lucide="message-circle" style="width:12px;height:12px"></i>WhatsApp</a>`:''}
          <button class="btn bo bsm" onclick="A.openVendorProfile('${v.id}')"><i data-lucide="eye" style="width:12px;height:12px"></i>View Profile</button>
          <button class="btn bg bsm" onclick="A.shareVendorProfile('${v.id}','${v.bizName.replace(/'/g,"\\'")}','${v.category}','${v.city}')"><i data-lucide="share-2" style="width:12px;height:12px"></i></button>
          ${S.user?.id===ADMIN_ID?`<button class="btn bg bsm" onclick="M.editVendor('${v.id}')"><i data-lucide="pencil" style="width:12px;height:12px"></i>Edit</button>`:''}
        </div>
      </div>
    </div>`;
  },

  _vendorCard(v,isAdmin){
    const logoUrl=v.logoId?fileUrl(v.logoId):null;
    const posterUrl=v.posterIds?.[0]?fileUrl(v.posterIds[0]):null;
    const userVoted=(v.voterIds||[]).includes(S.user?.id);
    const statusTag=v.status==='pending'?`<span class="tag tgd" style="font-size:.65rem">Under Review</span>`:'';
    return`<div class="cxcard" style="display:flex;gap:12px;align-items:flex-start">
      ${posterUrl?`<img src="${posterUrl}" style="width:80px;height:80px;border-radius:var(--rsm);object-fit:cover;flex-shrink:0;border:1px solid var(--bdr)">`
        :logoUrl?`<img src="${logoUrl}" style="width:80px;height:80px;border-radius:var(--rsm);object-fit:cover;flex-shrink:0;border:1px solid var(--bdr)">`
        :`<div style="width:80px;height:80px;border-radius:var(--rsm);background:var(--surf);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--t3)"><i data-lucide="store" style="width:22px;height:22px"></i></div>`}
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px">
          <span style="font-weight:600;font-size:.9rem">${v.bizName}</span>
          ${statusTag}
          ${v.priceRange?`<span style="font-size:.72rem;color:var(--t3)">${v.priceRange}</span>`:''}
        </div>
        ${v.tagline?`<div style="font-size:.78rem;color:var(--t2);margin-bottom:8px">${v.tagline}</div>`:''}
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <button class="btn bo bsm" onclick="A.openVendorProfile('${v.id}')"><i data-lucide="eye" style="width:11px;height:11px"></i>View</button>
          ${S.user?`<button class="btn ${userVoted?'bg':'bpur'} bsm" ${userVoted?'disabled':''} onclick="A.voteVendor('${v.id}')">
            <i data-lucide="thumbs-up" style="width:11px;height:11px"></i>${userVoted?'Voted':'Vote'} (${v.votes||0})
          </button>`:''}
          <button class="btn bg bsm" onclick="A.shareVendorProfile('${v.id}','${v.bizName.replace(/'/g,"\\'")}','${v.category}','${v.city}')"><i data-lucide="share-2" style="width:11px;height:11px"></i></button>
          ${isAdmin?`<button class="btn bg bsm" onclick="event.stopPropagation();M.editVendor('${v.id}')"><i data-lucide="pencil" style="width:11px;height:11px"></i>Edit</button>`:''}
          ${isAdmin&&v.status==='pending'?`<button class="btn bc bsm" onclick="A.adminApproveVendor('${v.id}')"><i data-lucide="check" style="width:11px;height:11px"></i>Approve</button><button class="btn bo bsm" onclick="A.adminRejectVendor('${v.id}')"><i data-lucide="x" style="width:11px;height:11px"></i>Reject</button>`:''}
        </div>
      </div>
    </div>`;
  },

  _portfolio(){
    return`<div style="display:flex;align-items:center;justify-content:center;padding:56px 24px"><div class="cscard">
      <div class="csgfx"><i data-lucide="line-chart" style="width:48px;height:48px"></i></div>
      <div class="csbadge"><i data-lucide="clock" style="width:11px;height:11px"></i>Coming Soon</div>
      <h2 class="cst">Portfolio Tracker</h2>

      <button class="btn bp" style="margin-top:26px" onclick="A.joinPortfolioWaitlist()"><i data-lucide="bell" style="width:14px;height:14px"></i>Join Waitlist</button>
    </div></div>`;
  },

  _payBlock(){
    return`<div class="pay-card" style="max-width:500px;margin:0 auto">
      <!-- Coupon / Trial CTA -->
      ${!S.subStatus||S.subStatus===null?`
      <div style="background:linear-gradient(135deg,#FBF8EC,#F5EEC8);border:1.5px solid #E8D9A0;border-radius:var(--rmd);padding:18px 20px;margin-bottom:20px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--pur)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>

          <input type="text" id="coupon-input" placeholder="Enter your code…" style="flex:1;min-width:140px;text-transform:uppercase;letter-spacing:.08em;font-weight:600" oninput="this.value=this.value.toUpperCase()"/>

            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
            Redeem
          </button>
        </div>
        <div class="ferr" id="coupon-err" style="margin-top:8px;min-height:16px"></div>

  welcomeGuide(){
    const steps=[
      {icon:'user-check',title:'Complete your profile',desc:'Upload a photo and submit your ID for the Verified badge — buyers trust verified sellers.'},
      {icon:'store',title:'Post your first listing',desc:'Head to the Marketplace and tap "Post Listing" to sell, buy, or request a service.'},
      {icon:'bar-chart-2',title:'Track live markets',desc:'Check real-time prices for 500+ crypto and financial assets in the Markets section.'},
      {icon:'zap',title:'Upgrade to Pro',desc:'Unlock the Open Forum, full marketplace access, and the Datum List for ₦10,000/month.'},
    ];
    let step=0;
    const show=()=>{
      const s=steps[step];
      const dots=steps.map((_,i)=>`<div style="width:7px;height:7px;border-radius:50%;background:${i===step?'var(--t1)':'var(--bdr2)'}"></div>`).join('');
      M.show(`<div class="mback">
        <div class="modal" style="text-align:center;max-width:420px">
          <div style="width:56px;height:56px;background:var(--t1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:var(--white)"><i data-lucide="${s.icon}" style="width:24px;height:24px"></i></div>
          <div style="font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:8px">Step ${step+1} of ${steps.length}</div>
          <h2 style="font-family:var(--fd);font-size:1.5rem;margin-bottom:10px;line-height:1.2">${s.title}</h2>
          <p style="font-size:.9rem;color:var(--t2);line-height:1.6;margin-bottom:28px">${s.desc}</p>
          <div style="display:flex;justify-content:center;gap:6px;margin-bottom:24px">${dots}</div>
          <div style="display:flex;gap:10px;justify-content:center">
            ${step>0?`<button class="btn bo" onclick="wgPrev()"><i data-lucide="arrow-left" style="width:13px;height:13px"></i>Back</button>`:''}
            ${step<steps.length-1
              ?`<button class="btn bp" onclick="wgNext()">Next<i data-lucide="arrow-right" style="width:13px;height:13px"></i></button>`
              :`<button class="btn bc" onclick="M.close();R.go('market')"><i data-lucide="store" style="width:13px;height:13px"></i>Go to Marketplace</button>`}
            ${step===0?`<button class="btn bg" onclick="M.close()">Skip</button>`:''}
          </div>
        </div>
      </div>`);
    };
    window.wgNext=()=>{step=Math.min(step+1,steps.length-1);show();};
    window.wgPrev=()=>{step=Math.max(step-1,0);show();};
    show();
  },

    if(page==='market'){S.mTab='board';S.mFilter='all';loadOrders();startAR();}

const A = {
  authTab(t){ S.authTab=t; M.auth(); },
  setUType(t){
    S.signupType=t;
    document.querySelectorAll('.utcard').forEach(el=>el.classList.remove('on'));
    document.querySelectorAll('.utcard').forEach(el=>{
      const icon=el.querySelector('.uticon i');
      if(el.querySelector('.utn')?.textContent==='Business'){
        el.classList.toggle('on',t==='A');
        if(icon){icon.closest('.uticon').style.background=t==='A'?'var(--t1)':'var(--surf)';icon.style.color=t==='A'?'var(--white)':'var(--t2)';}
      } else {
        el.classList.toggle('on',t==='B');
        if(icon){icon.closest('.uticon').style.background=t==='B'?'var(--t1)':'var(--surf)';icon.style.color=t==='B'?'var(--white)':'var(--t2)';}
      }
    });
  },

  async login(){
    const email=document.getElementById('lemail')?.value?.trim();
    const pwd=document.getElementById('lpwd')?.value;
    const err=document.getElementById('lerr');
    const btn=document.getElementById('lbtn');
    if(!email||!pwd){err.textContent='Please fill in all fields.';return;}
    btn.disabled=true;btn.textContent='Signing in…';
    try{
      await DB.login(email,pwd);
      const u=await DB.me();if(!u)throw new Error('No session');
      const res=await DB.list('profiles',[Query.equal('userId',[u.$id]),Query.limit(1)]);
      const p=res.documents[0];
      S.user={id:u.$id,name:p?.name||u.name,email:u.email,type:p?.type||'B',inits:initials(p?.name||u.name),joinedAt:u.$createdAt,avatarId:p?.avatarId||null};
      await Promise.all([loadWatchlist(),loadSubscription(),loadVerifyStatus(),loadMyConnections(),loadSentConnections(),loadNotifications(),loadNotifPrefs()]);
      W.load().then(()=>{ if(S.page==='wallet') render(); }).catch((e)=>{ console.error('W.load failed:',e); });
      initOneSignal(S.user.id);
      M.close();
      R.go('profile');
      const welcomeMsg=S.subStatus==='trial'
        ?'Welcome back! Your free trial is active.'
        :S.subStatus==='expired'
        ?'Welcome back! Your free trial has ended — upgrade to keep access.'
        :'Welcome back, '+S.user.name.split(' ')[0]+'!';
      toast(welcomeMsg,'ok');
    }catch(e){
      err.textContent='Login failed: '+(e.message.includes('401')||e.message.includes('invalid')?'Wrong email or password.':e.message);
      btn.disabled=false;btn.textContent='Sign In';
    }
  },

  async signup(){
    const name=document.getElementById('sname')?.value?.trim();
    const email=document.getElementById('semail')?.value?.trim();
    const pwd=document.getElementById('spwd')?.value;
    const type=S.signupType;
    const err=document.getElementById('serr');
    const btn=document.getElementById('sbtn');
    if(!name||!email||!pwd){err.textContent='Please fill in all fields.';return;}
    if(!type){err.textContent='Please select an account type.';return;}
    btn.disabled=true;btn.textContent='Creating account…';
    try{
      const u=await DB.register(email,pwd,name);
      await DB.login(email,pwd);
      const _sr=sessionStorage.getItem('tmc_ref')||'direct';
      const _sa=sessionStorage.getItem('tmc_agent')||'';
      await DB.create('profiles',{
        userId:u.$id,name,email,type,
        refSource:_sr,
        refAgent:_sa,
        refLandingPage:window.location.href,
      });
      sessionStorage.removeItem('tmc_ref');
      sessionStorage.removeItem('tmc_agent');
      // Reward referrer if they came from a referral link
      if(_sa&&_sa.length===12){
        // Find the referrer's full userId by matching first 12 chars
        (async()=>{
          try{
            const allProfiles=await DB.list('profiles',[Query.limit(500)]);
            const referrer=allProfiles.documents.find(p=>p.userId?.startsWith(_sa));
            if(referrer){
              // Give referrer TMC — load their wallet and credit them
              const refWallet=await DB.list('tmc_wallet',[
                Query.equal('userId',[referrer.userId]),
                Query.limit(1),
              ]);
              if(refWallet.documents[0]){
                const rw=refWallet.documents[0];
                const newBal=parseFloat(((rw.balance||0)+(TMC_RATES.referral||2)).toFixed(3));
                await _db.updateDocument(AW_DB_ID,'tmc_wallet',rw.$id,{
                  balance:newBal,
                  lifetimeEarned:parseFloat(((rw.lifetimeEarned||0)+(TMC_RATES.referral||2)).toFixed(3)),
                });
                // Log the transaction for referrer
                await _db.createDocument(AW_DB_ID,'tmc_transactions',ID.unique(),{
                  userId:referrer.userId,
                  type:'referral',
                  amount:TMC_RATES.referral||2,
                  balanceAfter:newBal,
                  description:`Referral bonus — ${name} signed up`,
                  refId:u.$id,
                  createdAt:new Date().toISOString(),
                });
                // Notify referrer
                await createNotif(referrer.userId,'connection',
                  `You earned ${TMC_RATES.referral} $TMC! 🎉`,
                  `${name} just signed up using your referral link.`,
                  'wallet'
                );
              }
            }
          }catch(e){console.warn('referral reward:',e.message);}
        })();
      }
      S.user={id:u.$id,name,email,type,inits:initials(name),joinedAt:new Date().toISOString(),avatarId:null};
      S.subscribed=false;S.subStatus=null;S.verifyStatus=null;
      S.myConnections=[];S.sentConnections=[];
      S.notifications=[];S.notifPrefs={categories:[],pushEnabled:false};

      // 1. Save notification preferences chosen at signup
      const signupCats=S._signupNotifCats||[];
      if(signupCats.length>0){
        try{
          const prefsDoc=await DB.create('notif_prefs',{userId:u.$id,categories:signupCats,pushEnabled:false});
          S.notifPrefs={categories:signupCats,pushEnabled:false};
          S.notifPrefsDocId=prefsDoc.$id;
        }catch(e){console.warn('signup notif prefs:',e.message);}
      }
      S._signupNotifCats=[];

      // 2. Load other data in parallel
      await Promise.all([
        loadWatchlist(),
        loadSubscription(),
        loadVerifyStatus(),
        loadMyConnections(),
        loadSentConnections(),
      ]);

      // 3. Welcome notification
      await createNotif(u.$id,'welcome',
        'Welcome to Toomuchcoin! 🎉',
        'Explore the marketplace, check live crypto prices, and start trading. Upgrade to Pro or start a free 30-day trial anytime.',
        'market'
      );
      await loadNotifications();

      initOneSignal(u.$id);
      M.close();
      R.go('profile');
      await loadNotifications();
      M.welcomeGuide();
      toast('Account created! Welcome, '+name.split(' ')[0]+'.','ok');
    }catch(e){
      err.textContent='Signup failed: '+(e.message.includes('409')?'Email already in use.':e.message);
      btn.disabled=false;btn.textContent='Create Account';
    }
  },

  async logout(){
    await DB.logout();
    S.user=null;S.watchlist=new Set();S.wlDocId=null;

  async submitAlert(coinId,coinName,currentPrice){
    if(!S.user) return;
    const dir=document.getElementById('alert-dir')?.value;
    const rawPrice=parseFloat(document.getElementById('alert-price')?.value);
    const err=document.getElementById('alert-err');
    const btn=document.getElementById('alert-btn');
    if(!rawPrice||isNaN(rawPrice)||rawPrice<=0){err.textContent='Please enter a valid target price.';return;}
    if(dir==='above'&&rawPrice<=currentPrice){err.textContent='Target must be above current price of '+fmtp(currentPrice)+'.';return;}
    if(dir==='below'&&rawPrice>=currentPrice){err.textContent='Target must be below current price of '+fmtp(currentPrice)+'.';return;}
    btn.disabled=true;btn.textContent='Setting alert…';
    try{
      const coin=S.coins.find(c=>c.id===coinId);
      const doc=await DB.create('price_alerts',{
        userId:S.user.id,
        coinId, coinName,
        coinSym:coin?.sym||coinId.toUpperCase(),
        targetPrice:rawPrice,
        direction:dir,
        triggered:false,
        createdAt:new Date().toISOString(),
      });
      if(!S._priceAlerts) S._priceAlerts=[];
      S._priceAlerts.push({
        id:doc.$id, coinId, coinName,
        coinSym:coin?.sym||coinId.toUpperCase(),
        targetPrice:rawPrice, direction:dir,
        triggered:false,
      });
      M.close();
      toast('Alert set! We\'ll notify you when '+coinName+' '+dir+' '+fmtp(rawPrice),'ok');
    }catch(e){
      err.textContent='Failed: '+e.message;
      btn.disabled=false;btn.textContent='Set Alert';
    }
  },

  drawChart(coinId,interval){
    const canvas=document.getElementById('price-chart');
    if(!canvas) return;
    const data=S._chartData?.[coinId]?.[interval]||[];
    if(!data.length) return;
    const coin=S.coins.find(c=>c.id===coinId);
    const pos=(data[data.length-1]?.p||0)>=(data[0]?.p||0);
    const lineColor=pos?'#1A7A4A':'#C43030';
    const fillColor=pos?'rgba(26,122,74,0.12)':'rgba(196,48,48,0.12)';
    const dpr=window.devicePixelRatio||1;

    // Calculate canvas width based on data points and interval
    const scrollWrap=document.getElementById('chart-scroll-wrap');
    const visibleWidth=scrollWrap?scrollWrap.getBoundingClientRect().width:window.innerWidth-48;
    const minPxPerPoint=interval==='10y'?12:interval==='5y'?8:interval==='ytd'?6:4;
    const canvasWidth=Math.max(visibleWidth, data.length*minPxPerPoint);
    const H=280;

    canvas.width=canvasWidth*dpr;
    canvas.height=H*dpr;
    canvas.style.width=canvasWidth+'px';
    canvas.style.height=H+'px';

    // Sync inner wrapper width
    const inner=document.getElementById('chart-scroll-inner');
    if(inner) inner.style.width=canvasWidth+'px';

    const ctx=canvas.getContext('2d');
    ctx.scale(dpr,dpr);
    const W=canvasWidth;
    const pad={top:20,right:16,bottom:30,left:14};
    const chartW=W-pad.left-pad.right;
    const chartH=H-pad.top-pad.bottom;
    const prices=data.map(d=>d.p);
    const minP=Math.min(...prices);
    const maxP=Math.max(...prices);
    const range=maxP-minP||1;
    // Add 0.5% right padding so the last point never sits flush against the edge
    const xScale=(i)=>pad.left+(i*(chartW/Math.max(data.length-1,1))*(1-0.005));
    const yScale=(p)=>pad.top+chartH-(((p-minP)/range)*chartH);

    // Draw grid lines
    ctx.strokeStyle='rgba(26,25,22,0.05)';
    ctx.lineWidth=1;
    for(let g=0;g<=4;g++){
      const y=pad.top+(g/4)*chartH;
      ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(W-pad.right,y);ctx.stroke();
    }

    // Draw chart
    A._drawChartBase(ctx,data,W,H,pad,xScale,yScale,lineColor,fillColor);

    // Build x-axis labels spread across full canvas width
    const xlabels=document.getElementById('chart-xlabels');
    if(xlabels){
      xlabels.style.width=canvasWidth+'px';
      xlabels.style.minWidth=canvasWidth+'px';
      const labelCount=Math.max(6,Math.floor(canvasWidth/120));
      const step=Math.floor((data.length-1)/(labelCount-1));
      const fmt=({
        '1d':(ts)=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
        '7d':(ts)=>new Date(ts).toLocaleDateString([],{weekday:'short',day:'numeric'}),
        '30d':(ts)=>new Date(ts).toLocaleDateString([],{month:'short',day:'numeric'}),
        'ytd':(ts)=>new Date(ts).toLocaleDateString([],{month:'short',year:'2-digit'}),
        '1y':(ts)=>new Date(ts).toLocaleDateString([],{month:'short',year:'2-digit'}),
        '5y':(ts)=>new Date(ts).toLocaleDateString([],{month:'short',year:'numeric'}),
        '10y':(ts)=>new Date(ts).toLocaleDateString([],{month:'short',year:'numeric'}),
      }[interval])||((ts)=>new Date(ts).toLocaleDateString());
      xlabels.innerHTML=Array.from({length:labelCount},(_,i)=>{
        const idx=Math.min(i*step,data.length-1);
        const x=xScale(idx);
        return`<span style="position:absolute;left:${x}px;transform:translateX(-50%);white-space:nowrap">${fmt(data[idx].ts)}</span>`;
      }).join('');
      xlabels.style.position='relative';
      xlabels.style.height='28px';
      xlabels.style.display='block';
    }

    // Sync label scroll with chart scroll
    if(scrollWrap&&xlabels){
      scrollWrap.onscroll=()=>{
        xlabels.scrollLeft=scrollWrap.scrollLeft;
        document.getElementById('chart-scroll-hint').style.opacity='0';
      };
      xlabels.onscroll=()=>{scrollWrap.scrollLeft=xlabels.scrollLeft;};
    }

    // Scroll to the right end by default (most recent data)
    setTimeout(()=>{
      if(scrollWrap) scrollWrap.scrollLeft=scrollWrap.scrollWidth;
      if(xlabels) xlabels.scrollLeft=xlabels.scrollWidth;
    },50);

    // Mouse/touch drag to pan
    let isDragging=false,dragStartX=0,dragScrollLeft=0;
    const onDragStart=(x)=>{isDragging=true;dragStartX=x;dragScrollLeft=scrollWrap.scrollLeft;canvas.style.cursor='grabbing';};
    const onDragMove=(x)=>{if(!isDragging)return;scrollWrap.scrollLeft=dragScrollLeft-(x-dragStartX);};
    const onDragEnd=()=>{isDragging=false;canvas.style.cursor='crosshair';};
    canvas.addEventListener('mousedown',e=>onDragStart(e.clientX));
    window.addEventListener('mousemove',e=>onDragMove(e.clientX));
    window.addEventListener('mouseup',onDragEnd);

    // Crosshair hover/touch
    const wrap=canvas.parentElement;
    const isMobile=window.innerWidth<=768;
    const fixedLabel=document.getElementById('chart-fixed-label');
    const fixPrice=document.getElementById('chart-fix-price');
    const fixDate=document.getElementById('chart-fix-date');
    const tooltip=document.getElementById('chart-tooltip');
    const tipPrice=document.getElementById('chart-tip-price');
    const tipDate=document.getElementById('chart-tip-date');
    const priceDisplay=document.getElementById('dd-price-display');
    const dateDisplay=document.getElementById('dd-date-display');

    const drawCrosshair=(clientX,clientY)=>{
      const canvasRect=canvas.getBoundingClientRect();
      const x=clientX-canvasRect.left;
      const idx=Math.max(0,Math.min(data.length-1,Math.round((x-pad.left)/chartW*(data.length-1))));
      const point=data[idx];
      const px=fmtp(point.p);
      const fmt2=({
        '1d':(ts)=>new Date(ts).toLocaleString([],{hour:'2-digit',minute:'2-digit',month:'short',day:'numeric'}),
        '7d':(ts)=>new Date(ts).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}),
        '30d':(ts)=>new Date(ts).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}),
        'ytd':(ts)=>new Date(ts).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}),
        '1y':(ts)=>new Date(ts).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}),
        '5y':(ts)=>new Date(ts).toLocaleDateString([],{month:'short',year:'numeric'}),
        '10y':(ts)=>new Date(ts).toLocaleDateString([],{month:'long',year:'numeric'}),
      }[interval])||((ts)=>new Date(ts).toLocaleDateString());
      const dateStr=fmt2(point.ts);
      A._drawChartBase(ctx,data,W,H,pad,xScale,yScale,lineColor,fillColor);
      const cx=xScale(idx);
      const cy=yScale(point.p);
      ctx.beginPath();ctx.moveTo(cx,pad.top);ctx.lineTo(cx,H-pad.bottom);
      ctx.strokeStyle='rgba(0,0,0,0.2)';ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fillStyle=lineColor;ctx.fill();
      ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      if(isMobile){
        if(fixedLabel){fixedLabel.style.display='block';fixPrice.textContent=px;fixDate.textContent=dateStr;}
      } else {
        if(tooltip){
          tooltip.style.display='block';
          tipPrice.textContent=px;tipDate.textContent=dateStr;
          const wrapRect=scrollWrap?scrollWrap.getBoundingClientRect():wrap.getBoundingClientRect();
          tooltip.style.left=Math.min(clientX-wrapRect.left+12,visibleWidth-150)+'px';
          tooltip.style.top=Math.max(clientY-wrapRect.top-36,4)+'px';
        }
      }
      if(priceDisplay) priceDisplay.textContent=px;
      if(dateDisplay) dateDisplay.textContent=dateStr;
    };

    const clearCrosshair=()=>{
      A._drawChartBase(ctx,data,W,H,pad,xScale,yScale,lineColor,fillColor);
      if(tooltip) tooltip.style.display='none';
      if(fixedLabel) fixedLabel.style.display='none';
      if(priceDisplay) priceDisplay.textContent=fmtp(coin?.price||0);
      if(dateDisplay) dateDisplay.textContent='';
    };

    canvas.addEventListener('mousemove',e=>{if(!isDragging) drawCrosshair(e.clientX,e.clientY);});
    canvas.addEventListener('mouseleave',clearCrosshair);
    canvas.addEventListener('touchmove',e=>{
      e.preventDefault();
      const t=e.touches[0];
      drawCrosshair(t.clientX,t.clientY);
    },{passive:false});
    canvas.addEventListener('touchend',()=>setTimeout(clearCrosshair,1400));
  },

  _drawChartBase(ctx,data,W,H,pad,xScale,yScale,lineColor,fillColor){
    ctx.clearRect(0,0,W,H);
    ctx.beginPath();
    ctx.moveTo(xScale(0),yScale(data[0].p));
    data.forEach((_,i)=>{if(i>0) ctx.lineTo(xScale(i),yScale(data[i].p));});
    ctx.lineTo(xScale(data.length-1),H-pad.bottom);
    ctx.lineTo(xScale(0),H-pad.bottom);
    ctx.closePath();
    ctx.fillStyle=fillColor;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(xScale(0),yScale(data[0].p));
    data.forEach((_,i)=>{if(i>0) ctx.lineTo(xScale(i),yScale(data[i].p));});
    ctx.strokeStyle=lineColor;
    ctx.lineWidth=2;
    ctx.lineJoin='round';
    ctx.stroke();
  },

  async loadChartData(coinId,interval){
    S._chartLoading=true;
    if(S.cryptoSub==='deepdive') render();
    if(!S._chartData) S._chartData={};
    if(!S._chartData[coinId]) S._chartData[coinId]={};

    const now2=new Date();
    const jan1=new Date(now2.getFullYear(),0,1);
    const ytdDays=Math.ceil((now2-jan1)/(24*60*60*1000))+1;
    const daysMap={'1d':1,'7d':7,'30d':30,'ytd':ytdDays,'1y':365,'5y':1825};
    const days=daysMap[interval]||ytdDays;

    const makeMockData=()=>{
      const coin=S.coins.find(c=>c.id===coinId);
      const currentPrice=coin?.price||1000;
      const now=Date.now();

      // Real historical anchor prices per asset (yearly Jan 1 prices)
      const HISTORY={
        bitcoin:    {2015:320,   2016:430,   2017:1000,  2018:14000, 2019:3500,  2020:7200,  2021:29000, 2022:47000, 2023:16500, 2024:42000, 2025:93000},
        ethereum:   {2016:8,     2017:8,     2018:750,   2019:140,   2020:130,   2021:730,   2022:3700,  2023:1200,  2024:2300,  2025:3400},
        gold:       {2015:1200,  2016:1060,  2017:1150,  2018:1300,  2019:1280,  2020:1520,  2021:1900,  2022:1800,  2023:1820,  2024:2060,  2025:2650},
        tether:     {2015:1,     2016:1,     2017:1,     2018:1,     2019:1,     2020:1,     2021:1,     2022:1,     2023:1,     2024:1,     2025:1},
        solana:     {2021:2,     2022:170,   2023:10,    2024:100,   2025:200},
        binancecoin:{2017:0.15,  2018:10,    2019:6,     2020:14,    2021:40,    2022:520,   2023:245,   2024:310,   2025:720},
      };

      const anchors=HISTORY[coinId];
      const startYear=days<=365?2025:days<=1825?2021:2015;
      const endYear=2026;

      if(anchors){
        // Build from real anchor data
        const points=[];
        for(let yr=startYear;yr<=endYear;yr++){
          const startPrice=anchors[yr]||anchors[Object.keys(anchors).filter(k=>k<=yr).pop()]||currentPrice;
          const endPrice=anchors[yr+1]||currentPrice;
          const stepsPerYear=days<=365?52:12;
          for(let s=0;s<stepsPerYear;s++){
            const t=new Date(yr,0,1).getTime()+(s/stepsPerYear)*365*24*60*60*1000;
            if(t>now) break;
            const progress=s/stepsPerYear;
            const trend=startPrice+(endPrice-startPrice)*progress;
            const noise=(Math.random()-0.5)*(trend*0.08);
            points.push({ts:t,p:Math.max(trend+noise,0.000001)});
          }
        }
        // Make last point current price
        if(points.length) points[points.length-1].p=currentPrice;
        // Filter to requested timeframe
        const cutoff=now-days*24*60*60*1000;
        const filtered=points.filter(p=>p.ts>=cutoff);
        if(filtered.length>2) return filtered;
      }

      // Generic fallback
      const points=days<=1?48:days<=7?56:days<=30?60:days<=365?52:120;
      const step=(days*24*60*60*1000)/points;
      let price=currentPrice*(0.6+Math.random()*0.3);
      const vol=days<=1?0.002:days<=7?0.008:days<=30?0.015:0.025;
      return Array.from({length:points},(_,i)=>{
        price=price*(1+(Math.random()-0.46)*vol);
        if(i===points-1) price=currentPrice;
        return{ts:now-(points-i-1)*step,p:Math.max(price,0.000001)};
      });
    };

    try{
      // Try without API key first (free tier)
      const url=`https://api.coingecko.com/api/v3/coins/${coinId}/market_chart?vs_currency=usd&days=${days}&x_cg_demo_api_key=CG-ukJ4Loyx3D9ZvYm1B8smA1tP`;
      const r=await fetch(url);
      if(!r.ok) throw new Error(r.status);
      const data=await r.json();
      const prices=data.prices||[];
      if(!prices.length) throw new Error('empty');
      S._chartData[coinId][interval]=prices.map(([ts,p])=>({ts,p}));
    }catch(e){
      console.warn('chartData:',e.message,'— using mock data');
      // Always fall back to mock so chart renders
      S._chartData[coinId][interval]=makeMockData();
    }

    S._chartLoading=false;
    if(S.cryptoSub==='deepdive') render();
    setTimeout(()=>A.drawChart(coinId,interval),80);
  },

      const msg=alert.coinName+' hit your target of '+fmtp(alert.targetPrice)+'! Current price: '+fmtp(coin.price);

        alert.coinSym+' price alert triggered 🔔',

        alert.coinSym+' price alert triggered 🔔',
        msg,
        'https://toomuchcoin.com?page=crypto'
      );
      toast(alert.coinSym+' hit '+fmtp(alert.targetPrice)+'!','ok');
    }
  },

  async sendMsg(){
    const inp=document.getElementById('cinput');
    const txt=inp?.value?.trim();
    if(!txt||!S.user) return;
    A.hideMentionDropdown();
    inp.value='';
    const now=new Date().toISOString();

    // Resolve @mentions against the full platform user list
    const knownUsers=await A._loadAllUsersForMention();
    const mentionRegex=/@([A-Za-z0-9_]+(?:\s[A-Za-z0-9_]+)?)/g;
    const taggedIds=new Set();
    let match;
    while((match=mentionRegex.exec(txt))!==null){
      const nameGuess=match[1].toLowerCase();
      const found=knownUsers.find(u=>u.name.toLowerCase().startsWith(nameGuess)||u.name.toLowerCase().split(' ')[0]===nameGuess);
      if(found&&found.userId!==S.user.id) taggedIds.add(found.userId);
    }
    const taggedArr=[...taggedIds];

    if(!S.msgs)S.msgs=[];
    S.msgs.push({id:'l'+Date.now(),userId:S.user.id,userName:S.user.name,inits:S.user.inits,text:txt,own:true,ts:now,tagged:taggedArr});
    render();
    DB.create('chat',{userId:S.user.id,userName:S.user.name,initials:S.user.inits,text:txt,tagged:taggedArr})
      .catch(e=>console.warn('chat:',e.message));

    (async()=>{
      try{
        // Notify tagged users directly first
        for(const uid of taggedArr){
          await createNotif(uid,'reply',S.user.name+' tagged you in the forum','"'+txt.slice(0,90)+(txt.length>90?'…':'')+'"','market');
          await pushNotif(uid,S.user.name+' tagged you','"'+txt.slice(0,100)+'"','https://toomuchcoin.com?page=market');
        }
        // Existing reply-detection notif for others (skip anyone already tagged)
        const msgs=S.msgs||[];
        const replied=new Set(taggedArr);
        for(const m of msgs){
          if(m.userId===S.user.id||replied.has(m.userId)) continue;
          if(txt.toLowerCase().includes(m.userName.split(' ')[0].toLowerCase())||
             msgs.slice(-6).some(x=>x.userId===m.userId&&x.userId!==S.user.id)){
            replied.add(m.userId);
            await createNotif(m.userId,'reply',S.user.name+' replied in the forum','"'+txt.slice(0,80)+(txt.length>80?'…':'')+'"','market');
            await pushNotif(m.userId,S.user.name+' replied in the forum',txt.slice(0,100));
          }
        }
      }catch(e){console.warn('reply notif:',e.message);}
    })();
  },

  // Cache of all platform users for @mention lookup — loaded once, reused
  async _loadAllUsersForMention(forceReload=false){
    const cached=_cacheGet('mention_users',1800000); // 30 min cache
    if(cached&&!forceReload){S._allUsersCache=cached;return cached;}
    if(S._allUsersCache&&!forceReload) return S._allUsersCache;
    try{
      let all=[];
      let lastId=null;
      for(let page=0;page<10;page++){ // safety cap: up to 1000 users (10 x 100)
        const queries=[Query.limit(100)];
        if(lastId) queries.push(Query.cursorAfter(lastId));
        const r=await DB.list('profiles',queries);
        if(!r.documents.length) break;
        all=all.concat(r.documents);
        lastId=r.documents[r.documents.length-1].$id;
        if(r.documents.length<100) break; // last page
      }
      console.log('[mention] loaded',all.length,'profile documents from Appwrite');
      S._allUsersCache=all.map(d=>({
        userId:d.userId,
        name:d.name,
        inits:initials(d.name),
      })).filter(u=>u.userId&&u.name);
      _cacheSet('mention_users',S._allUsersCache);
      console.log('[mention] usable users after filter:',S._allUsersCache.length);
      return S._allUsersCache;
    }catch(e){
      console.warn('mention user load:',e.message);
      return[];
    }
  },

  chatKeydown(e){
    const dd=document.getElementById('mention-dropdown');
    const isOpen=dd&&dd.style.display==='block';
    if(isOpen){
      const items=[...dd.querySelectorAll('.mention-item')];
      let idx=items.findIndex(i=>i.classList.contains('active'));
      if(e.key==='ArrowDown'){
        e.preventDefault();
        idx=(idx+1)%items.length;
        items.forEach(i=>i.classList.remove('active'));
        items[idx]?.classList.add('active');
        return;
      }
      if(e.key==='ArrowUp'){
        e.preventDefault();
        idx=idx<=0?items.length-1:idx-1;
        items.forEach(i=>i.classList.remove('active'));
        items[idx]?.classList.add('active');
        return;
      }
      if(e.key==='Enter'||e.key==='Tab'){
        const active=items.find(i=>i.classList.contains('active'))||items[0];
        if(active){
          e.preventDefault();
          active.click();
          return;
        }
      }
      if(e.key==='Escape'){A.hideMentionDropdown();return;}
    }
    if(e.key==='Enter'&&!isOpen) A.sendMsg();
  },

  async checkMention(inp){
    const val=inp.value;
    const cursor=inp.selectionStart;
    const upToCursor=val.slice(0,cursor);
    const atMatch=upToCursor.match(/@([A-Za-z0-9_]*)$/);
    const dd=document.getElementById('mention-dropdown');
    if(!atMatch||!dd){A.hideMentionDropdown();return;}
    const query=atMatch[1].toLowerCase();
    const atStart=cursor-atMatch[0].length;

    // Show a tiny loading state on first open while the user list loads
    if(!S._allUsersCache){
      dd.innerHTML=`<div style="padding:12px 14px;font-size:.78rem;color:var(--t3)">Loading users…</div>`;
      dd.style.display='block';
      dd._atStart=atStart;
    }

    const allUsers=await A._loadAllUsersForMention();
    // Guard against the input changing while the fetch was in flight
    if(document.activeElement!==inp) return;
    const reCheck=inp.value.slice(0,inp.selectionStart).match(/@([A-Za-z0-9_]*)$/);
    if(!reCheck){A.hideMentionDropdown();return;}

    const users=allUsers.filter(u=>u.userId!==S.user?.id);
    const q2=reCheck[1].toLowerCase();
    const filtered=q2?users.filter(u=>u.name.toLowerCase().includes(q2)):users;

    if(filtered.length===0){
      dd.innerHTML=`<div style="padding:12px 14px;font-size:.78rem;color:var(--t3)">No matching users</div>`;
      dd.style.display='block';
      return;
    }
    dd.innerHTML=filtered.slice(0,30).map((u,i)=>`
      <div class="mention-item ${i===0?'active':''}" onclick="A.pickMention('${u.userId}','${u.name.replace(/'/g,"\\'")}')">
        <div class="mention-avat">${u.inits}</div>
        <span style="font-size:.8125rem;font-weight:500">${u.name}</span>
      </div>`).join('');
    dd.style.display='block';
    dd._atStart=cursor-reCheck[0].length;
  },

  pickMention(userId,name){
    const inp=document.getElementById('cinput');
    const dd=document.getElementById('mention-dropdown');
    if(!inp||!dd) return;
    const start=dd._atStart??0;
    const cursor=inp.selectionStart;
    const before=inp.value.slice(0,start);
    const after=inp.value.slice(cursor);
    const firstName=name.split(' ')[0];
    inp.value=before+'@'+firstName+' '+after;
    const newPos=(before+'@'+firstName+' ').length;
    inp.focus();
    inp.setSelectionRange(newPos,newPos);
    A.hideMentionDropdown();
  },

          </button>
        </div>
      </div>`);
      // Wire up click-to-focus on the full image
      setTimeout(()=>{
        const wrap=document.getElementById('av-focus-wrap');
        const fullImg=document.getElementById('av-focus-full');
        const previewImg=document.getElementById('av-preview-img');
        const dot=document.getElementById('av-focus-dot');
        const label=document.getElementById('av-focus-label');
        const valInput=document.getElementById('av-focus-val');
        if(!wrap) return;
        wrap.addEventListener('click',ev=>{
          const rect=fullImg.getBoundingClientRect();
          const xPct=Math.round(((ev.clientX-rect.left)/rect.width)*100);
          const yPct=Math.round(((ev.clientY-rect.top)/rect.height)*100);
          const focusVal=xPct+'% '+yPct+'%';
          valInput.value=focusVal;
          // Move dot
          dot.style.display='block';
          dot.style.left=xPct+'%';
          dot.style.top=yPct+'%';
          // Update preview
          previewImg.style.objectPosition=focusVal;
          label.textContent='Focus: '+focusVal;
        });
      },100);
    };
    input.click();
  },

  async submitDealDone(id){
    const inp=document.getElementById('deal-price-'+id);
    const rawVal=inp?.value||'';
    const fp=parseFloat(rawVal.replace(/[^0-9.]/g,''));
    if(!fp||isNaN(fp)||fp<=0){toast('Please enter the final agreed price.','err');return;}
    const comm=(fp*0.02).toFixed(2);
    const btn=document.getElementById('deal-btn-'+id);
    if(btn){btn.disabled=true;btn.textContent='Saving…';}

    // Pull connection from local state BEFORE any await
    const allConns=S.myConnections||[];
    const conn=allConns.find(x=>x.id===id);
    const orderId=conn?.orderId||null;
    const buyerNameVal=conn?.fromName||'';

    try{
      // Step 1: update the connection
      await DB.update('connections',id,{
        status     : 'deal_done',
        finalPrice : fp,
        commissionAmt: '$'+comm,
        buyerName  : buyerNameVal,
      });

      // Step 2: update the order to filled
      if(orderId){
        await DB.update('orders',orderId,{status:'filled'});
        // reflect immediately in local state (if market was already loaded)
        if(S.orders){
          const ord=S.orders.find(x=>x.id===orderId);
          if(ord) ord.status='filled';
        }
      }

      await loadMyConnections();
      const doneConn=(S.myConnections||[]).find(c=>c.id===id);
      if(doneConn){
        await createNotif(doneConn.fromUserId,'deal','Deal marked complete','The seller has marked your deal for "'+doneConn.orderTitle+'" as complete. Please confirm in your profile.','profile',doneConn.orderId);
        await pushNotif(doneConn.fromUserId,'Deal complete','Confirm your deal for "'+doneConn.orderTitle+'" in your profile.');
      }
      render();
      toast('Deal marked complete. Commission due: $'+comm,'ok');
      W.earn('deal','Completed a deal',id).catch(()=>{});
    }catch(e){
      console.error('submitDealDone error:',e);
      toast('Error: '+e.message,'err');
      if(btn){btn.disabled=false;btn.textContent='Confirm';}
    }
  },

  async submitCommission(id){

      await DB.update('connections',id,{status:'comm_pending',commissionRef:ref});

      // Calculate charity allocation (10% of commission)
      const conn=(S.myConnections||[]).find(c=>c.id===id);
      const commAmt=parseFloat((conn?.commissionAmt||'').replace(/[^0-9.]/g,'')||0);
      const charityAmt=(commAmt*0.10).toFixed(2);
      const charityShare=(commAmt*0.10/3).toFixed(2);
      const CHARITIES=[
        {name:'Feed the Future Africa',focus:'Food security across sub-Saharan Africa'},
        {name:'Code for Kids Foundation',focus:'Digital literacy for underserved youth'},
        {name:'Clean Water Initiative NG',focus:'Safe water access in rural Nigeria'},
      ];

      // Notify the seller about charity deduction
      await createNotif(S.user.id,'deal',
        'Thank you — your commission supports good causes',
        '10% of your commission ($'+charityAmt+') is automatically allocated across our 3 supported charities: '+
        CHARITIES.map(c=>c.name).join(', ')+'. Each receives $'+charityShare+'. Thank you for being part of something bigger.',
        'profile',id
      );

      // Notify admin with charity breakdown
      await createNotif(ADMIN_ID,'commission',

        ' | Charity pool (10%): $'+charityAmt+
        ' | Per charity: $'+charityShare+
        ' | Charities: '+CHARITIES.map(c=>c.name+' ('+c.focus+')').join(' · '),
        'profile',id
      );

      await loadMyConnections();render();
      toast('Payment submitted! 10% ($'+charityAmt+') goes to our 3 supported charities. Thank you!','ok');

      toast('We couldn\'t record your payment right now. Please try again.','err');
      if(btn){btn.disabled=false;btn.textContent='I Have Paid';}

  async showNewsSummary(headline,source,date,summary){
    const h=headline.replace(/&quot;/g,'"').replace(/&#39;/g,"'");
    const s=summary.replace(/&quot;/g,'"').replace(/&#39;/g,"'");
    // Show modal with loading state first
    M.show(`<div class="mback" onclick="if(event.target===this)M.close()">
      <div class="modal" style="max-width:520px">
        <div class="mhdr">
          <div>
            <div class="mey" style="display:flex;align-items:center;gap:8px">

            </div>
            <h2 class="mtitle" style="font-size:1.1rem;line-height:1.35;margin-top:6px">${h}</h2>
          </div>
          <button class="mclose" onclick="M.close()"><i data-lucide="x" style="width:15px;height:15px"></i></button>
        </div>
        <div id="news-summary-body" style="font-size:.9rem;color:var(--t2);line-height:1.8;padding:4px 0 8px;min-height:80px;display:flex;align-items:center;gap:10px">
          <div class="spin" style="width:18px;height:18px;border-width:2px;flex-shrink:0"></div>
          <span style="color:var(--t3)">Generating summary…</span>
        </div>
        <div style="background:var(--off);border-radius:var(--rsm);padding:12px 14px;font-size:.78rem;color:var(--t3);line-height:1.6;margin-top:8px;display:flex;align-items:flex-start;gap:8px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          AI-generated briefing. Always do your own research before making investment decisions.
        </div>
      </div>
    </div>`);
    lucide.createIcons();

    // Generate real summary via KayKay AI function
    try{
      const kkFnId=(window.TMC_CONFIG||{}).KAYKAY_FN_ID;
      let summaryText='';
      if(kkFnId){
        const prompt=`You are a financial journalist writing for a premium investment platform called Toomuchcoin. 

Write a concise but detailed briefing (4-6 sentences, about 120-160 words) about this news story:

HEADLINE: "${h}"
SOURCE: ${source}
DATE: ${date}
CONTEXT: ${s}

Rules:
- Write in a confident, informed tone like a Bloomberg or FT journalist
- Include what happened, why it matters to investors, and what to watch next
- Be specific — mention asset classes, percentages, or companies where relevant
- End with one forward-looking sentence about market implications
- Do NOT say "In conclusion" or use bullet points
- Do NOT mention you are an AI`;

        const execution=await _fn.createExecution(
          kkFnId,
          JSON.stringify({
            systemPrompt:'You are a concise financial news analyst. Write clear, professional market briefings.',
            messages:[{role:'user',content:prompt}]
          }),
          false
        );
        const result=JSON.parse(execution.responseBody||'{}');
        if(result.success&&result.reply) summaryText=result.reply;
      }

  async redeemCoupon(){
    if(!S.user){M.auth();toast('Sign in first to redeem your code.');return;}
    const code=(document.getElementById('coupon-input')?.value||'').trim().toUpperCase();
    const err=document.getElementById('coupon-err');
    const btn=document.getElementById('coupon-btn');
    if(!code){err.textContent='Please enter your coupon code.';return;}

    // Check user hasn't already had a trial or active sub
    const existingSub=await DB.list('subscription',[
      Query.equal('userId',[S.user.id]),
      Query.limit(5),
    ]);
    const alreadyUsed=existingSub.documents.some(d=>
      d.status==='trial'||d.status==='active'||d.status==='expired'
    );
    if(alreadyUsed){
      err.textContent='You\'ve already used a trial or have an active subscription.';
      return;
    }

    btn.disabled=true;btn.textContent='Checking…';
    err.textContent='';

    try{
      // Find the coupon
      const r=await DB.list('coupons',[Query.equal('code',[code]),Query.limit(1)]);
      const coupon=r.documents[0];

      if(!coupon||!coupon.active){
        err.textContent='That code isn\'t valid. Double-check and try again.';
        btn.disabled=false;btn.textContent='Redeem';
        return;
      }
      if(coupon.usedCount>=coupon.maxUses){
        err.textContent='This code has already reached its maximum number of uses.';
        btn.disabled=false;btn.textContent='Redeem';
        return;
      }
      if((coupon.usedBy||[]).includes(S.user.id)){
        err.textContent='You\'ve already redeemed this code.';
        btn.disabled=false;btn.textContent='Redeem';
        return;
      }

      // All checks passed — activate trial
      btn.textContent='Activating…';
      const days=coupon.trialDays||7;
      const trialEnd=new Date(Date.now()+days*24*60*60*1000).toISOString();

      // Update coupon usage
      const updatedUsedBy=[...(coupon.usedBy||[]),S.user.id];
      await DB.update('coupons',coupon.$id,{
        usedCount:(coupon.usedCount||0)+1,
        usedBy:updatedUsedBy,
      });

      // Create subscription record
      await DB.create('subscription',{
        userId:S.user.id,status:'trial',plan:'trial',
        amount:'0',reference:'COUPON_'+code,
        paymentMethod:'coupon',trialEnd,
      });

      S.subStatus='trial';
      S.subscribed=true;
      S._trialDoc={status:'trial',trialEnd};

      const endDate=new Date(trialEnd).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
      await createNotif(S.user.id,'subscription',
        'Your '+days+'-day free trial is active! 🎉',
        'Code redeemed successfully. You now have full Pro access until '+endDate+'. Upgrade before then to keep access.',
        'sub'
      );
      await loadNotifications();
      render();
      toast('Code accepted! You have '+days+' days of full Pro access.','ok');

    }catch(e){
      err.textContent='Something went wrong. Please try again.';
      btn.disabled=false;btn.textContent='Redeem';
    }
  },

  async submitVendorListing(isAdminAddStr){
    const isAdminAdd=isAdminAddStr==='true'&&S.user?.id===ADMIN_ID;
    const bizName=document.getElementById('vs-name')?.value?.trim();
    const tagline=document.getElementById('vs-tagline')?.value?.trim();
    const about=document.getElementById('vs-about')?.value?.trim();
    const category=document.getElementById('vs-cat')?.value;
    const priceRange=document.getElementById('vs-price')?.value||'';
    const city=document.getElementById('vs-city')?.value?.trim();
    const country=document.getElementById('vs-country')?.value?.trim();
    const whatsapp=document.getElementById('vs-whatsapp')?.value?.trim();
    const phone=document.getElementById('vs-phone')?.value?.trim();
    const website=document.getElementById('vs-website')?.value?.trim();
    const instagram=document.getElementById('vs-instagram')?.value?.trim();
    const email=document.getElementById('vs-email')?.value?.trim();
    const hours=document.getElementById('vs-hours')?.value?.trim();
    const years=document.getElementById('vs-years')?.value?.trim();
    const err=document.getElementById('vs-err');
    const btn=document.getElementById('vs-btn');

    if(!bizName){err.textContent='Please add a business name.';return;}
    if(!category){err.textContent='Please select a category.';return;}
    if(!city){err.textContent='Please add a city.';return;}
    if(!country){err.textContent='Please add a country.';return;}
    if(!whatsapp&&!phone&&!email){err.textContent='Please add at least one way for customers to reach you — WhatsApp, phone, or email.';return;}

    btn.disabled=true;btn.textContent='Uploading…';

    let logoId='';
    const logoInput=document.getElementById('vs-logo-input');
    if(logoInput?.files[0]){
      try{
        const up=await _storage.createFile(BUCKET_ID,ID.unique(),logoInput.files[0]);
        logoId=up.$id;
      }catch(e){console.warn('logo upload:',e.message);}
    }

    const posterFiles=S._vendorPosterFiles||[];
    const posterIds=[];
    const posterCaptions=[];
    if(posterFiles.length){
      btn.textContent='Uploading photos…';
      for(const item of posterFiles){
        try{
          const up=await _storage.createFile(BUCKET_ID,ID.unique(),item.file);
          posterIds.push(up.$id);
          posterCaptions.push(item.caption||'');
        }catch(e){console.warn('poster upload:',e.message);}
      }
    }

    btn.textContent='Saving…';
    try{
      const doc=await DB.create('vendors',{
        userId:S.user.id,
        submittedByAdmin:isAdminAdd,
        bizName, about:about||'', tagline:tagline||'',
        category, city, country,
        logoId, posterIds, posterCaptions,
        whatsapp:whatsapp||'', website:website||'', instagram:instagram||'',
        phone:phone||'', email:email||'',
        hours:hours||'', priceRange:priceRange||'', yearsActive:years||'',
        status:isAdminAdd?'approved':'pending',
        votes:0, voterIds:[], isCommunityPick:false,
      });

      M.close();
      S._vendorPosterFiles=[];

      if(isAdminAdd){
        toast(bizName+' added directly to the directory!','ok');
      }else{
        toast(bizName+' submitted! It\'s now live in the directory while we review it.','ok');
        await createNotif(ADMIN_ID,'connection',
          'New vendor submission: '+bizName,
          category+' in '+city+' — submitted by '+S.user.name,
          'profile','',  'vendor'
        );
      }

      // Refresh the directory view if currently on the vendors tab
      if(S.page==='market'&&S.mTab==='vendors'){
        await A.loadVendorDirectory(category,city);
      }
      render();
    }catch(e){
      err.textContent='Something went wrong submitting your listing. Please try again.';
      btn.disabled=false;btn.textContent=isAdminAdd?'Add to Directory':'Submit My Business';
    }
  },
  
  async voteVendor(vendorId){
    if(!S.user){M.auth();return;}
    const list=S._vendorDirectory||[];
    const v=list.find(x=>x.id===vendorId);
    if(!v) return;
    if((v.voterIds||[]).includes(S.user.id)){toast('You already voted for this business.','notif');return;}

    const newVoterIds=[...(v.voterIds||[]),S.user.id];
    const newVotes=(v.votes||0)+1;
    try{
      await DB.update('vendors',vendorId,{votes:newVotes,voterIds:newVoterIds});
      v.votes=newVotes;
      v.voterIds=newVoterIds;
      toast('Vote cast for '+v.bizName+'!','ok');
      W.earn('vote','Voted for '+v.bizName,vendorId).catch(()=>{});

      // Recalculate Community Pick for this category+city — highest votes wins the pinned slot
      await A.recalcCommunityPick(v.category,v.city);
      await A.loadVendorDirectory(v.category,v.city);
    }catch(e){
      toast('Could not register your vote. Please try again.','err');
    }
  },

  async recalcCommunityPick(category,city){
    try{
      const r=await DB.list('vendors',[
        Query.equal('category',[category]),
        Query.equal('city',[city]),
        Query.equal('status',['approved']),
        Query.orderDesc('votes'),
        Query.limit(50),
      ]);
      const docs=r.documents;
      if(!docs.length) return;
      const topVotes=docs[0].votes||0;
      if(topVotes<=0) return; // no votes yet, nobody should be pinned
      const winnerId=docs[0].$id;
      await Promise.all(docs.map(d=>{
        const shouldBePick=d.$id===winnerId;
        if(d.isCommunityPick!==shouldBePick){
          return DB.update('vendors',d.$id,{isCommunityPick:shouldBePick}).catch(()=>{});
        }
        return Promise.resolve();
      }));
    }catch(e){console.warn('recalcCommunityPick:',e.message);}
  },

  async saveVendorEdit(vendorId){
    if(S.user?.id!==ADMIN_ID) return;
    const bizName=document.getElementById('ve-name')?.value?.trim();
    const err=document.getElementById('ve-err');
    const btn=document.getElementById('ve-btn');
    if(!bizName){err.textContent='Business name is required.';return;}
    btn.disabled=true;btn.textContent='Saving…';

    const v=(S._vendorDirectory||[]).find(x=>x.id===vendorId);
    const isPick=document.getElementById('ve-pick')?.checked||false;
    const newStatus=document.getElementById('ve-status')?.value||'pending';
    const focusVal=document.getElementById('ve-focus-val')?.value||'center center';

    // Handle logo
    let logoId=v?.logoId||'';
    if(S._editVendorRemoveLogo){
      logoId='';
      S._editVendorRemoveLogo=false;
    } else if(S._editVendorNewLogo){
      btn.textContent='Uploading logo…';
      try{
        const up=await _storage.createFile(BUCKET_ID,ID.unique(),S._editVendorNewLogo);
        logoId=up.$id;
      }catch(e){console.warn('logo upload:',e.message);}
      S._editVendorNewLogo=null;
    }

    // Handle poster removals — filter out removed IDs from current lists
    const removed=new Set(S._editVendorRemovedPosters||[]);
    let posterIds=(v?.posterIds||[]).filter(id=>!removed.has(id));
    let posterCaptions=(v?.posterIds||[]).map((id,i)=>removed.has(id)?null:(v?.posterCaptions?.[i]||'')).filter((_,i)=>!removed.has((v?.posterIds||[])[i]));

    // Update captions for remaining existing posters
    const galleryList=document.getElementById('ve-gallery-list');
    if(galleryList){
      const rows=galleryList.querySelectorAll('[id^="ve-poster-"]');
      rows.forEach((row,ri)=>{
        const capInput=row.querySelector('[id^="ve-cap-"]');
        if(capInput&&posterCaptions[ri]!==undefined) posterCaptions[ri]=capInput.value||'';
      });
    }

    // Upload new posters
    if((S._editVendorNewPosters||[]).length){
      btn.textContent='Uploading photos…';
      for(const item of S._editVendorNewPosters){
        if(posterIds.length>=6) break;
        try{
          const up=await _storage.createFile(BUCKET_ID,ID.unique(),item.file);
          posterIds.push(up.$id);
          posterCaptions.push(item.caption||'');
        }catch(e){console.warn('poster upload:',e.message);}
      }
      S._editVendorNewPosters=[];
    }
    S._editVendorRemovedPosters=[];

    btn.textContent='Saving…';
    try{
      await DB.update('vendors',vendorId,{
        bizName,
        category:document.getElementById('ve-cat')?.value||v?.category,
        tagline:document.getElementById('ve-tagline')?.value?.trim()||'',
        about:document.getElementById('ve-about')?.value?.trim()||'',
        whatsapp:document.getElementById('ve-whatsapp')?.value?.trim()||'',
        phone:document.getElementById('ve-phone')?.value?.trim()||'',
        website:document.getElementById('ve-website')?.value?.trim()||'',
        instagram:document.getElementById('ve-instagram')?.value?.trim()||'',
        email:document.getElementById('ve-email')?.value?.trim()||'',
        hours:document.getElementById('ve-hours')?.value?.trim()||'',
        yearsActive:document.getElementById('ve-years')?.value?.trim()||'',
        status:newStatus,
        isCommunityPick:isPick,
        logoId,
        posterIds,
        posterCaptions,
        coverFocus:focusVal,
      });
      if(isPick){
        if(v) await A.recalcCommunityPick(v.category,v.city);
        await DB.update('vendors',vendorId,{isCommunityPick:true});
      }
      M.close();
      toast('Vendor updated!','ok');
      if(S._vCat&&S._vCity) await A.loadVendorDirectory(S._vCat,S._vCity);
      render();
    }catch(e){
      err.textContent='Save failed: '+e.message;
      btn.disabled=false;btn.textContent='Save Changes';
    }
  },

  async adminRejectVendor(vendorId){

  async recalcCommunityPick(category,city){
    try{
      const r=await DB.list('vendors',[
        Query.equal('category',[category]),
        Query.equal('city',[city]),
        Query.equal('status',['approved']),
        Query.orderDesc('votes'),
        Query.limit(50),
      ]);
      const docs=r.documents;
      if(!docs.length) return;
      const topVotes=docs[0].votes||0;
      if(topVotes<=0) return;
      const winnerId=docs[0].$id;
      await Promise.all(docs.map(d=>{
        const shouldBePick=d.$id===winnerId;
        if(d.isCommunityPick!==shouldBePick){
          return DB.update('vendors',d.$id,{isCommunityPick:shouldBePick}).catch(()=>{});
        }
        return Promise.resolve();
      }));
    }catch(e){console.warn('recalcCommunityPick:',e.message);}
  },

        let localBaselines={};
        try{localBaselines=JSON.parse(localStorage.getItem('datum_user_baselines'))||{};}catch(e){}
        const merged={...localBaselines,...cloudBaselines};
        localStorage.setItem('datum_user_baselines',JSON.stringify(merged));
        // Save merged back to cloud if local had keys cloud didn't
        const cloudKeys=Object.keys(cloudBaselines);
        const mergedKeys=Object.keys(merged);
        if(mergedKeys.length>cloudKeys.length&&p.$id){
          DB.update('profiles',p.$id,{joinBaselines:JSON.stringify(merged)}).catch(()=>{});
