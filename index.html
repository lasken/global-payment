    else if(path.startsWith('/marketplace/openforum'))  { S.page='market';S.mTab='forum'; }
    else if(path.startsWith('/financial/datumlist'))    { S.page='crypto';S.cryptoSub='assetlist'; }
    else if(path.startsWith('/financial/coinmarkets'))  { S.page='crypto';S.cryptoSub='market'; }
    else if(path.startsWith('/financial/watchlist'))    { S.page='crypto';S.cryptoSub='watchlist'; }
    else if(path.startsWith('/financial'))              { S.page='crypto'; }
    else if(path.startsWith('/blog/'))                  { S.page='blogpost'; }
    else if(path.startsWith('/blog'))                   { S.page='blog'; }
    else if(path.startsWith('/howtoguides/'))           { S.page='blogpost'; }
    else if(path==='/subscribe')                        { S.page='sub'; }
    else if(path==='/profile')                          { S.page='profile'; }
    else if(path==='/kaykay')                           { S.page='kaykay'; }
    else if(path==='/wallet')                           { S.page='wallet'; }
    else { S.page='land'; }
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  });

  detectCurrency().then(()=>render());
  loadCoins();
  A.loadAdminProfile();
  // Register PWA service worker
  if('serviceWorker' in navigator && location.hostname !== '127.0.0.1' && location.hostname !== 'localhost'){
    navigator.serviceWorker.register('/sw.js')
      .then(()=>console.log('SW registered'))
      .catch(e=>console.warn('SW failed:',e));
  }
  // PWA install prompt
  let _pwaPrompt=null;
  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault();
    _pwaPrompt=e;
    // Show banner after 3 seconds if not already installed
    setTimeout(()=>{
      if(!_pwaPrompt) return;
      const banner=document.createElement('div');
      banner.id='pwa-banner';
      banner.innerHTML=`
        <div style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:999;background:var(--t1);color:#fff;border-radius:var(--rlg);padding:14px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--s3);max-width:calc(100vw - 32px);width:380px;animation:pup .3s ease">
          <img src="/toomuchcoin.png" style="width:38px;height:38px;border-radius:10px;flex-shrink:0">
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:.875rem">Install Toomuchcoin</div>
            <div style="font-size:.75rem;opacity:.7;margin-top:2px">Add to your home screen for the best experience</div>
          </div>
          <div style="display:flex;gap:8px;flex-shrink:0">
            <button onclick="document.getElementById('pwa-banner').remove();_pwaPrompt=null" style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:var(--rsm);padding:7px 12px;font-size:.78rem;cursor:pointer;font-family:var(--fb)">Later</button>
            <button onclick="A.installPWA()" style="background:#fff;border:none;color:var(--t1);border-radius:var(--rsm);padding:7px 12px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:var(--fb)">Install</button>
          </div>
        </div>`;
      document.body.appendChild(banner);
    }, 3000);
  });
  window._pwaPromptRef=()=>_pwaPrompt;
  window._clearPwaPrompt=()=>{_pwaPrompt=null;};
  // Initialize KayKay
  kkLoadLocal();
  kkBuildPersona();
  // Inject dot animation CSS
  if(!document.getElementById('kk-dot-style')){
    const s=document.createElement('style');
    s.id='kk-dot-style';
    s.textContent='@keyframes kkDot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}';
    document.head.appendChild(s);
  }
  // Voice/wake-word temporarily disabled — coming soon
  // if(S.user&&KK.wakeWord){
  //   setTimeout(()=>kkStartWakeWord(),2000);
  // }
  // Pretty URL routing — map clean paths to SPA state
  const _path=window.location.pathname;

  // Clean blog URL: /blog/slug
  if(_path.startsWith('/blog/')){
    const _bSlug=_path.replace('/blog/','').replace(/\/$/,'');
    if(_bSlug){
      history.replaceState({},'',_path);
      (async()=>{
        await A.loadBlogPosts();
        const post=(S._blogPosts||[]).find(p=>
          p.slug===_bSlug||
          (p.title||'').toLowerCase().trim().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,'-').slice(0,50)===_bSlug
        );
        if(post){S._currentPost=post;S.page='blogpost';render();}
        else R.go('blog');
      })();
    }
  }

  // Clean guide URL: /howtoguides/category/slug
  if(_path.startsWith('/howtoguides/')){
    const _parts=_path.replace('/howtoguides/','').split('/');
    const _gCat=_parts[0]||'datum_basics';
    const _gSlug=_parts[1]||'';
    history.replaceState({},'',_path);
    (async()=>{
      await A.loadBlogPosts();
      const post=(S._blogPosts||[]).find(p=>
        p.type==='guide'&&(
          p.slug===_gSlug||
          (p.title||'').toLowerCase().trim().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,'-').slice(0,50)===_gSlug
        )
      );
      if(post){S._currentPost=post;S.page='blogpost';render();}
      else{S.page='blog';render();}
    })();
  }

  // Clean vendor URL: /marketplace/vendorlist/slug
  if(_path.startsWith('/marketplace/vendorlist/')){
    const _vSlug=_path.replace('/marketplace/vendorlist/','').replace(/\/$/,'');
    if(_vSlug&&_vSlug!==''){
      history.replaceState({},'',_path);
      S.page='market';S.mTab='vendors';render();
      setTimeout(async()=>{
        try{
          const r=await DB.list('vendors',[Query.limit(200)]);
          const match=r.documents.find(d=>{
            const s=(d.bizName||'').toLowerCase().trim()
              .replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').slice(0,48).replace(/-$/,'');
            return s===_vSlug||d.$id===_vSlug;
          });
          if(match) A.openVendorProfile(match.$id);
        }catch(e){console.warn('vendor deep link:',e);}
      },400);
    }
  }

  if(_path==='/marketplace/orderboard'){
    history.replaceState({},'','/marketplace/orderboard');
    S.page='market';S.mTab='board';loadOrders();startAR();render();
  } else if(_path==='/marketplace/vendorlist'){
    history.replaceState({},'','/marketplace/vendorlist');
    S.page='market';S.mTab='vendors';render();
  } else if(_path==='/marketplace/openforum'){
    history.replaceState({},'','/marketplace/openforum');
    S.page='market';S.mTab='forum';loadChat();render();
  } else if(_path==='/financial/coinmarkets'){
    history.replaceState({},'','/financial/coinmarkets');
    S.page='crypto';S.cryptoSub='market';loadCoins();render();
  } else if(_path==='/financial/datumlist'){
    history.replaceState({},'','/financial/datumlist');
    S.page='crypto';S.cryptoSub='assetlist';loadCoins();render();
  } else if(_path==='/financial/watchlist'){
    history.replaceState({},'','/financial/watchlist');
    S.page='crypto';S.cryptoSub='watchlist';loadCoins();render();
  } else if(_path.startsWith('/blog/')){
    const _blogSlug=_path.replace('/blog/','');
    history.replaceState({},'',_path);
    (async()=>{
      await A.loadBlogPosts();
      const post=(S._blogPosts||[]).find(p=>p.slug===_blogSlug||p.id===_blogSlug);
      if(post){S._currentPost=post;S.page='blogpost';render();}
      else R.go('blog');
    })();
  }

  // 404 fallback for completely unknown paths
  const _knownPaths=['/','/marketplace/orderboard','/marketplace/vendorlist','/marketplace/openforum','/financial/coinmarkets','/financial/datumlist','/financial/watchlist','/financial/portfolio','/blog','/subscribe','/profile','/kaykay'];
  const _isKnown=_knownPaths.includes(_path)||_path.startsWith('/blog/')||_path.startsWith('/howtoguides/')||_path.startsWith('/marketplace/vendorlist/')||_path.startsWith('/api/');
  if(!_isKnown&&_path!=='/'&&_path!==''){
    S.page='404';render();
  }
  const _qs=new URLSearchParams(window.location.search);
  const _vCat=_qs.get('vendors');
  const _vCity=_qs.get('city');
  if(_vCat){
    history.replaceState({},'',window.location.pathname);
    S._vCat=_vCat;
    S._vCity=_vCity?_vCity.replace(/-/g,' ').replace(/\b\w/g,l=>l.toUpperCase()):null;
    S.page='market';S.mTab='vendors';
    render();
  }
  // Resolve ?listing= deep links (supports both slug and raw id)
  if(_qs.get('reset')==='1'){
    const _rUserId=_qs.get('userId');
    const _rSecret=_qs.get('secret');
    if(_rUserId&&_rSecret){
      history.replaceState({},'',window.location.pathname);
      M.resetPassword(_rUserId,_rSecret);
    }
  }
  // Resolve ?blog= deep links
  const _blogParam=_qs.get('blog');
  if(_blogParam){
    history.replaceState({},'',window.location.pathname);
    await A.loadBlogPosts();
    const post=(S._blogPosts||[]).find(p=>{
      if(p.slug===_blogParam||p.id===_blogParam) return true;
      const derived=p.title.toLowerCase().trim()
        .replace(/[^a-z0-9\s]/g,'')
        .replace(/\s+/g,'-')
        .replace(/-+/g,'-')
        .slice(0,50)
        .replace(/-$/,'');
      return derived===_blogParam;
    });
    if(post){S._currentPost=post;S.page='blogpost';render();}
    else R.go('blog');
  }
  const _vendorParam=_qs.get('vendor');
  if(_vendorParam){
    history.replaceState({},'',window.location.pathname);
    S.page='market';S.mTab='vendors';
    render();
    setTimeout(async()=>{
      // Try slug map first, then fall back to treating it as a raw ID
      const resolvedId=(S._vendorSlugMap||{})[_vendorParam]||_vendorParam;
      // If it looks like a slug (not an Appwrite ID), search by bizName
      const looksLikeSlug=!/^[a-f0-9]{20,}$/i.test(_vendorParam);
      if(looksLikeSlug&&!resolvedId.match(/^[a-f0-9]{20,}$/i)){
        try{
          const r=await DB.list('vendors',[Query.limit(100)]);
          const match=r.documents.find(d=>{
            const s=d.bizName.toLowerCase().trim()
              .replace(/[^a-z0-9\s-]/g,'')
              .replace(/\s+/g,'-')
              .replace(/-+/g,'-')
              .slice(0,48)
              .replace(/-$/,'');
            return s===_vendorParam;
          });
          if(match) A.openVendorProfile(match.$id);
        }catch(e){console.warn('vendor deep link resolve:',e.message);}
      } else {
        A.openVendorProfile(resolvedId);
      }
    },300);
  }

  const _listingParam=_qs.get('listing');
  if(_listingParam){
    await loadOrders();
    S._slugMap=S._slugMap||{};
    // Try slug map first, then fall back to direct id match
    const _resolvedId=S._slugMap[_listingParam]||_listingParam;
    const _linked=(S.orders||[]).find(o=>{
      // Match by stored slug, direct id, or freshly generated slug from title
      const tSlug=(o.title||'').toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').slice(0,48).replace(/-$/,'');
      return o.id===_resolvedId||tSlug===_listingParam;
    });
    if(_linked){ R.go('market'); setTimeout(()=>A.viewOrder(_linked.id),300); }
  }
});
// Global error boundary
window.addEventListener('error', e=>{
  console.error('App error:',e.message,e.filename,e.lineno);
  const root=document.getElementById('root');
  if(root&&root.innerHTML.trim()===''){
    root.innerHTML=`<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center">
      <img src="/toomuchcoin.png" style="width:48px;height:48px;margin:0 auto 16px;opacity:.5">
      <div style="font-family:Georgia,serif;font-size:1.2rem;color:#1A1916;margin-bottom:8px">Something went wrong</div>
      <div style="font-size:.875rem;color:#6B6860;margin-bottom:24px;max-width:340px;line-height:1.6">The app hit an unexpected error. Please refresh the page — if it keeps happening, contact help@toomuchcoin.com</div>
      <button onclick="location.reload()" style="background:#D4AF37;color:#1a1408;border:none;border-radius:6px;padding:11px 24px;font-weight:700;cursor:pointer;font-family:system-ui">Refresh Page</button>
    </div>`;
  }
});
window.addEventListener('unhandledrejection', e=>{
  console.warn('Unhandled promise rejection:',e.reason);
});
</script>
</body>
</html>
