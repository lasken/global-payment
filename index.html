<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Toomuchcoin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0/dist/iife/sdk.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    :root{
      --white:#fff;--off:#F8F7F4;--surf:#F2F1EE;--bdr:#E4E2DC;--bdr2:#C8C5BC;
      --t1:#1A1916;--t2:#6B6860;--t3:#A8A49C;
      --grn:#1A7A4A;--red:#C43030;--blu:#2B5BE0;--org:#C4622D;--gld:#B8892A;
      --rsm:6px;--rmd:12px;--rlg:20px;
      --s1:0 1px 3px rgba(26,25,22,.06),0 1px 2px rgba(26,25,22,.04);
      --s2:0 4px 16px rgba(26,25,22,.08),0 2px 6px rgba(26,25,22,.05);
      --s3:0 16px 48px rgba(26,25,22,.12),0 6px 20px rgba(26,25,22,.07);
      --ease:all .22s cubic-bezier(.4,0,.2,1);
      --fd:'DM Serif Display',Georgia,serif;
      --fb:'DM Sans',system-ui,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px;scroll-behavior:smooth}
    body{font-family:var(--fb);background:var(--white);color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    .hidden{display:none!important}
    img{display:block}

    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--rsm);font-family:var(--fb);font-size:.875rem;font-weight:500;cursor:pointer;border:none;transition:var(--ease);text-decoration:none;white-space:nowrap}
    .btn:disabled{opacity:.5;cursor:not-allowed!important;transform:none!important}
    .bp{background:var(--t1);color:var(--white)}
    .bp:hover:not(:disabled){background:#333028;transform:translateY(-1px);box-shadow:var(--s2)}
    .bo{background:transparent;color:var(--t1);border:1.5px solid var(--bdr2)}
    .bo:hover:not(:disabled){border-color:var(--t1);background:var(--off)}
    .bg{background:transparent;color:var(--t2);padding:8px 12px}
    .bg:hover{background:var(--surf);color:var(--t1)}
    .bsm{padding:7px 14px;font-size:.8125rem}
    .bc{background:var(--grn);color:var(--white)}
    .bc:hover:not(:disabled){background:#155f39;transform:translateY(-1px)}

    .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;font-size:.75rem;font-weight:500}
    .tg{background:#E6F5EE;color:var(--grn)}
    .tr{background:#FDEAEA;color:var(--red)}
    .tb{background:#E8EEFB;color:var(--blu)}
    .to{background:#FDF0EA;color:var(--org)}
    .tgd{background:#FBF4E6;color:var(--gld)}
    .tn{background:var(--surf);color:var(--t2)}

    input,textarea,select{font-family:var(--fb);font-size:.875rem;border:1.5px solid var(--bdr);border-radius:var(--rsm);padding:10px 14px;width:100%;background:var(--white);color:var(--t1);outline:none;transition:var(--ease);appearance:none}
    input:focus,textarea:focus,select:focus{border-color:var(--t1);box-shadow:0 0 0 3px rgba(26,25,22,.08)}
    input::placeholder,textarea::placeholder{color:var(--t3)}
    input:disabled,textarea:disabled{background:var(--surf);cursor:not-allowed;color:var(--t3)}
    label{display:block;font-size:.8125rem;font-weight:500;color:var(--t2);margin-bottom:6px}
    .fg{margin-bottom:18px}
    .ferr{font-size:.75rem;color:var(--red);margin-top:5px;min-height:18px}

    #gnav{position:fixed;top:0;left:0;right:0;z-index:900;background:rgba(255,255,255,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:60px}
    .nbrand{font-family:var(--fd);font-size:1.375rem;color:var(--t1);cursor:pointer;user-select:none}
    .nbrand span{color:var(--org)}
    .nact{display:flex;align-items:center;gap:8px}
    .nubadge{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:100px;background:var(--surf);font-size:.8125rem;font-weight:500;cursor:pointer;transition:var(--ease)}
    .nubadge:hover{background:var(--bdr)}
    .navat{width:28px;height:28px;border-radius:50%;background:var(--t1);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:.75rem;font-weight:600}

    .page{min-height:100vh;padding-top:60px;animation:pup .28s ease}
    @keyframes pup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    #pg-land{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:80px 24px 60px}
    .l-ey{font-size:.72rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:20px}
    .l-h{font-family:var(--fd);font-size:clamp(2.2rem,5vw,3.5rem);line-height:1.12;letter-spacing:-.02em;color:var(--t1);text-align:center;max-width:640px;margin-bottom:16px}
    .l-h em{font-style:italic;color:var(--org)}
    .l-sub{font-size:1rem;color:var(--t2);text-align:center;max-width:440px;line-height:1.6;margin-bottom:60px}
    .ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:960px;width:100%}
    .gcard{background:var(--white);border:1.5px solid var(--bdr);border-radius:var(--rlg);padding:36px 32px;cursor:pointer;transition:var(--ease);display:flex;flex-direction:column}
    .gcard:hover{border-color:var(--bdr2);transform:translateY(-4px);box-shadow:var(--s3)}
    .gci{width:48px;height:48px;border-radius:var(--rmd);display:flex;align-items:center;justify-content:center;margin-bottom:24px}
    .id{background:var(--t1);color:var(--white)}
    .iw{background:#FDF0EA;color:var(--org)}
    .ib{background:#E8EEFB;color:var(--blu)}
    .gcl{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:8px}
    .gct{font-family:var(--fd);font-size:1.5rem;line-height:1.2;color:var(--t1);margin-bottom:12px}
    .gcd{font-size:.875rem;color:var(--t2);line-height:1.6;flex:1}
    .gca{display:flex;align-items:center;gap:6px;margin-top:28px;font-size:.8125rem;font-weight:500;color:var(--t1);transition:var(--ease)}
    .gcard:hover .gca{gap:10px}

    .mback{position:fixed;inset:0;z-index:1000;background:rgba(26,25,22,.52);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fin .2s ease}
    @keyframes fin{from{opacity:0}to{opacity:1}}
    .modal{background:var(--white);border-radius:var(--rlg);padding:36px 40px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;box-shadow:var(--s3);animation:mup .24s cubic-bezier(.4,0,.2,1)}
    .modal-lg{max-width:660px}
    @keyframes mup{from{transform:translateY(16px) scale(.98);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
    .mhdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
    .mtitle{font-family:var(--fd);font-size:1.7rem;line-height:1.15}
    .mey{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
    .mclose{background:var(--surf);border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:var(--ease);flex-shrink:0}
    .mclose:hover{background:var(--bdr);color:var(--t1)}
    .mtabs{display:flex;border-bottom:1.5px solid var(--bdr);margin-bottom:26px}
    .mtab{padding:10px 20px;font-size:.875rem;font-weight:500;color:var(--t3);cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:var(--ease)}
    .mtab.on{color:var(--t1);border-bottom-color:var(--t1)}
    .utgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 22px}
    .utcard{border:2px solid var(--bdr);border-radius:var(--rmd);padding:20px 16px;cursor:pointer;transition:var(--ease);text-align:center}
    .utcard.on{border-color:var(--t1);background:var(--off)}
    .uticon{width:40px;height:40px;border-radius:var(--rsm);background:var(--surf);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--t2)}
    .utcard.on .uticon{background:var(--t1);color:var(--white)}
    .utn{font-weight:600;font-size:.875rem;color:var(--t1);margin-bottom:4px}
    .utd{font-size:.72rem;color:var(--t2);line-height:1.5}
    .aswitch{text-align:center;margin-top:18px;font-size:.875rem;color:var(--t2)}
    .aswitch a{color:var(--t1);font-weight:500;cursor:pointer;text-decoration:underline}

    #pg-profile{padding:40px 24px;max-width:780px;margin:0 auto}
    .phero{display:flex;align-items:center;gap:24px;padding:28px 32px;background:var(--off);border:1px solid var(--bdr);border-radius:var(--rlg);margin-bottom:24px}
    .pavat{width:68px;height:68px;border-radius:50%;background:var(--t1);color:var(--white);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:1.6rem;flex-shrink:0}
    .pname{font-family:var(--fd);font-size:1.4rem;margin-bottom:4px}
    .pmeta{font-size:.875rem;color:var(--t2)}
    .ptbadge{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 12px;background:var(--white);border:1px solid var(--bdr);border-radius:100px;font-size:.8rem;font-weight:500}
    .pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
    .psc{background:var(--white);border:1px solid var(--bdr);border-radius:var(--rmd);padding:20px}
    .psv{font-family:var(--fd);font-size:1.7rem;margin-bottom:4px}
    .psl{font-size:.8125rem;color:var(--t2)}
    .psec{background:var(--white);border:1px solid var(--bdr);border-radius:var(--rmd);padding:22px;margin-bottom:14px}
    .psect{font-weight:600;font-size:.875rem;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bdr)}
    .irow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bdr);font-size:.875rem}
    .irow:last-child{border-bottom:none}
    .irl{color:var(--t2)}
    .irv{font-weight:500}

    #pg-market{padding:40px 24px;max-width:1080px;margin:0 auto}
    .pghdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:16px}
    .pgttl{font-family:var(--fd);font-size:clamp(1.7rem,3vw,2.2rem);line-height:1.15;margin-bottom:6px}
    .pgsub{font-size:.9rem;color:var(--t2)}
    .tnav{display:flex;gap:4px;background:var(--surf);border-radius:var(--rmd);padding:4px;margin-bottom:26px}
    .tbtn{flex:1;padding:9px 16px;border-radius:8px;font-size:.875rem;font-weight:500;border:none;background:transparent;color:var(--t2);cursor:pointer;transition:var(--ease);display:flex;align-items:center;justify-content:center;gap:7px}
    .tbtn.on{background:var(--white);color:var(--t1);box-shadow:var(--s1)}
    .fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:22px}
    .flbl{font-size:.8125rem;font-weight:500;color:var(--t2);margin-right:4px}
    .ftag{padding:6px 14px;border-radius:100px;border:1.5px solid var(--bdr);background:var(--white);font-size:.8125rem;font-weight:500;color:var(--t2);cursor:pointer;transition:var(--ease)}
    .ftag.on,.ftag:hover{border-color:var(--t1);color:var(--t1);background:var(--off)}
    .ogrid{display:grid;gap:12px}
    .ocard{background:var(--white);border:1.5px solid var(--bdr);border-radius:var(--rmd);padding:20px 22px;transition:var(--ease);display:flex;align-items:flex-start;gap:14px}
    .ocard:hover{border-color:var(--bdr2);box-shadow:var(--s2);transform:translateY(-1px)}
    .oavat{width:40px;height:40px;border-radius:50%;background:var(--surf);display:flex;align-items:center;justify-content:center;color:var(--t2);flex-shrink:0;font-size:.78rem;font-weight:700;font-family:var(--fd)}
    .obody{flex:1;min-width:0}
    .otop{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
    .ottl{font-weight:600;font-size:.925rem}
    .ometa{font-size:.8125rem;color:var(--t2);margin-bottom:10px;line-height:1.5}
    .ofoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .oprice{font-weight:700;font-size:.9rem}
    .oacts{margin-left:auto;display:flex;gap:8px}
    .oempty{text-align:center;padding:56px 24px;color:var(--t3)}
    .oloading{text-align:center;padding:40px;color:var(--t3);font-size:.875rem}

    .odh{background:var(--off);border-radius:var(--rmd);padding:22px;margin-bottom:22px}
    .odtags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
    .odtitle{font-family:var(--fd);font-size:1.3rem;margin-bottom:10px;line-height:1.25}
    .odprice{font-family:var(--fd);font-size:1.9rem;color:var(--t1);margin-bottom:4px}
    .odmeta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
    .odmi{background:var(--surf);border-radius:var(--rsm);padding:11px 14px}
    .odml{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--t3);margin-bottom:3px}
    .odmv{font-size:.875rem;font-weight:500}
    .selcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--bdr);border-radius:var(--rmd);margin-bottom:18px}
    .selavat{width:42px;height:42px;border-radius:50%;background:var(--t1);color:var(--white);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:.95rem;font-weight:700;flex-shrink:0}
    .selname{font-weight:600;font-size:.9375rem;margin-bottom:3px}
    .selstat{font-size:.75rem;color:var(--t2)}
    .cform{background:var(--off);border-radius:var(--rmd);padding:18px;border:1.5px solid var(--bdr)}
    .cformtitle{font-weight:600;font-size:.875rem;margin-bottom:14px}

    .fab{position:fixed;bottom:32px;right:32px;background:var(--t1);color:var(--white);border:none;border-radius:100px;padding:13px 22px;font-family:var(--fb);font-size:.875rem;font-weight:500;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:var(--s3);transition:var(--ease);z-index:100}
    .fab:hover{transform:translateY(-2px);box-shadow:0 20px 60px rgba(26,25,22,.22)}

    .chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 290px);min-height:460px;border:1.5px solid var(--bdr);border-radius:var(--rmd);overflow:hidden}
    .chat-hdr{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;background:var(--off)}
    .cdot{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 0 3px rgba(26,122,74,.2)}
    .chat-feed{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;background:var(--white)}
    .cmsg{display:flex;gap:10px}
    .cmsg.own{flex-direction:row-reverse}
    .cavat{width:30px;height:30px;border-radius:50%;background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:700;flex-shrink:0;color:var(--t2);font-family:var(--fd)}
    .cmsg.own .cavat{background:var(--t1);color:var(--white)}
    .cbwrap{max-width:70%}
    .cmsg.own .cbwrap{text-align:right}
    .csender{font-size:.72rem;font-weight:500;color:var(--t2);margin-bottom:3px}
    .cbub{display:inline-block;padding:9px 13px;border-radius:11px;font-size:.86rem;line-height:1.5;text-align:left;background:var(--off);color:var(--t1)}
    .cmsg.own .cbub{background:var(--t1);color:var(--white)}
    .ctime{font-size:.68rem;color:var(--t3);margin-top:3px}
    .chat-ibar{padding:12px 14px;border-top:1px solid var(--bdr);display:flex;gap:9px;background:var(--white)}
    .chat-ibar input{flex:1}
    .csendbtn{width:38px;height:38px;border-radius:var(--rsm);background:var(--t1);color:var(--white);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--ease)}
    .csendbtn:hover{background:#333028}
    .chat-empty{text-align:center;padding:40px;color:var(--t3);font-size:.875rem}

    #pg-crypto{padding:40px 24px;max-width:1080px;margin:0 auto}
    .csubnav{display:flex;gap:4px;margin-bottom:26px;background:var(--surf);border-radius:var(--rmd);padding:4px;max-width:fit-content}
    .mtbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
    .swrap{position:relative;flex:1;min-width:180px;max-width:300px}
    .swrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
    .swrap input{padding-left:36px}
    .mtwrap{border:1.5px solid var(--bdr);border-radius:var(--rmd);overflow:hidden}
    .lrow{text-align:center;padding:48px;color:var(--t3);font-size:.875rem}
    .spin{display:inline-block;width:22px;height:22px;border:2px solid var(--bdr);border-top-color:var(--t1);border-radius:50%;animation:sp .7s linear infinite;margin-bottom:10px}
    @keyframes sp{to{transform:rotate(360deg)}}
    table{width:100%;border-collapse:collapse;font-size:.875rem}
    thead th{background:var(--off);padding:11px 15px;text-align:left;font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--t2);white-space:nowrap;border-bottom:1px solid var(--bdr)}
    th.r,td.r{text-align:right}
    tbody tr{border-bottom:1px solid var(--bdr);transition:background .14s;cursor:pointer}
    tbody tr:last-child{border-bottom:none}
    tbody tr:hover{background:var(--off)}
    td{padding:13px 15px;vertical-align:middle}
    .acell{display:flex;align-items:center;gap:11px}
    .aico{width:34px;height:34px;border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;font-family:var(--fd)}
    .aico img{width:34px;height:34px;object-fit:contain}
    .aname{font-weight:600;font-size:.9rem}
    .asym{font-size:.72rem;color:var(--t3);margin-top:1px}
    .price-c{font-weight:600;font-variant-numeric:tabular-nums}
    .cp{color:var(--grn);font-weight:500}
    .cn{color:var(--red);font-weight:500}
    .wbtn{background:none;border:none;cursor:pointer;color:var(--t3);transition:var(--ease);padding:4px;border-radius:4px;display:flex;align-items:center}
    .wbtn.on{color:var(--gld)}
    .wbtn:hover{color:var(--gld);background:var(--surf)}
    .pgn{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--bdr);background:var(--off)}
    .pgninf{font-size:.8125rem;color:var(--t2)}
    .pgnc{display:flex;gap:4px}
    .pgbtn{width:30px;height:30px;border-radius:var(--rsm);border:1.5px solid var(--bdr);background:var(--white);font-size:.8rem;cursor:pointer;transition:var(--ease);display:flex;align-items:center;justify-content:center;color:var(--t2)}
    .pgbtn.on{background:var(--t1);color:var(--white);border-color:var(--t1)}
    .pgbtn:hover:not(.on){border-color:var(--bdr2);color:var(--t1)}
    .pgbtn:disabled{opacity:.35;cursor:not-allowed}
    .ahero{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:14px}
    .aherol{display:flex;align-items:center;gap:14px}
    .aheroico{width:54px;height:54px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:700;font-family:var(--fd)}
    .aheroico img{width:54px;height:54px;object-fit:contain}
    .aheroname{font-family:var(--fd);font-size:1.65rem}
    .aherosym{font-size:.875rem;color:var(--t2);margin-top:2px}
    .aheroprice{font-family:var(--fd);font-size:2.4rem;letter-spacing:-.02em}
    .itabs{display:flex;gap:4px;background:var(--surf);border-radius:8px;padding:4px;width:fit-content;margin-bottom:14px}
    .ibtn{padding:7px 15px;border-radius:6px;border:none;font-size:.8125rem;font-weight:500;cursor:pointer;background:transparent;color:var(--t2);transition:var(--ease)}
    .ibtn.on{background:var(--white);color:var(--t1);box-shadow:var(--s1)}
    .chartwrap{border:1.5px solid var(--bdr);border-radius:var(--rmd);overflow:hidden;margin-bottom:22px}

<body>

<nav id="gnav">
  <div class="nbrand" onclick="R.go('land')">Toomuchcoin<span>.</span></div>
  <div class="nact" id="nact"></div>
</nav>

<main id="root"></main>
<div id="mroot"></div>
<div class="toast" id="toast"></div>
<button class="fab hidden" id="fab" onclick="M.createOrder()">
  <i data-lucide="plus" style="width:17px;height:17px"></i>
  <span>Post Listing</span>
</button>

<script>
'use strict';

const AW_ENDPOINT   = 'https://cloud.appwrite.io/v1';
const AW_PROJECT_ID = '6a163159003bd203c63f';
const AW_DB_ID      = '6a1631ee00269fc986b8';
const AW_COL = {
  profiles : 'profiles',
  orders   : 'orders',
  chat     : 'chat',
  watchlist: 'watchlist',
};

const { Client, Account, Databases, Query, ID } = Appwrite;
const _cl  = new Client().setEndpoint(AW_ENDPOINT).setProject(AW_PROJECT_ID);
const _acc = new Account(_cl);
const _db  = new Databases(_cl);

const DB = {
  me()          { return _acc.get().catch(()=>null) },
  login(e,p)    { return _acc.createEmailPasswordSession(e,p) },
  register(e,p,n){ return _acc.create(ID.unique(),e,p,n) },
  logout()      { return _acc.deleteSession('current').catch(()=>{}) },
  list(col,q=[]) {
    return _db.listDocuments(AW_DB_ID, AW_COL[col], q).catch(()=>({documents:[]}));
  },
  create(col,data) {
    return _db.createDocument(AW_DB_ID, AW_COL[col], ID.unique(), data);
  },
  update(col,id,data) {
    return _db.updateDocument(AW_DB_ID, AW_COL[col], id, data);
  },
};

const S = {
  page : 'land',
  user : null,        

  mTab   : 'board',
  mFilter: 'all',
  orders : null,       
  msgs   : null,      
  ordersLoading: false,
  msgsLoading  : false,

  viewedOrder: null,

  coins     : [],    
  coinsState: 'idle',  
  cryptoSub : 'market',
  selCoin   : null,
  watchlist : new Set(),
  wlDocId   : null,
  interval  : 'ytd',
  csearch   : '',
  cpage     : 1,
  cps       : 20,

  authTab  : 'login',
  signupType: null,
};

function initials(n=''){
  return (n||'').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase()||'??';
}
function ago(iso){
  const s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function fmtp(p){
  if(p==null||isNaN(p)) return '—';
  if(p<0.0001) return '$'+p.toFixed(8);
  if(p<0.01)   return '$'+p.toFixed(6);
  if(p<1)      return '$'+p.toFixed(4);
  return '$'+p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtpct(n){
  if(n==null||isNaN(n)) return '—';
  return (n>=0?'+':'')+Number(n).toFixed(2)+'%';
}
function toast(msg,type=''){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast'+(type?' '+type:'');
  el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),3200);
}
const COLORS=[
  ['#F7931A','#1A1916'],['#627EEA','#fff'],['#26A17B','#fff'],
  ['#E84142','#fff'],['#2775CA','#fff'],['#F3BA2F','#1A1916'],
  ['#9945FF','#fff'],['#00FFA3','#1A1916'],['#E5179E','#fff'],
  ['#1DA1F2','#fff'],['#FF007A','#fff'],['#8247E5','#fff'],
  ['#F0B90B','#1A1916'],['#2B9FDB','#fff'],['#C2A633','#fff'],
];
function coinIcon(coin,idx,size=34){
  const [bg,fg]=COLORS[idx%COLORS.length];
  if(coin.logo){
    return `<div class="aico" style="width:${size}px;height:${size}px;background:#f0f0f0">
      <img src="${coin.logo}" alt="${coin.sym}" width="${size}" height="${size}"
           onerror="this.parentNode.style.background='${bg}';this.parentNode.innerHTML='<span style=color:${fg};font-size:.62rem;font-weight:700>${coin.sym.slice(0,3)}</span>'"/>
    </div>`;
  }
  return `<div class="aico" style="width:${size}px;height:${size}px;background:${bg};color:${fg}">${coin.sym.slice(0,3)}</div>`;
}
function mockBars(id,iv){
  const seed=[...id].reduce((a,c)=>a+c.charCodeAt(0),0);
  const n=iv==='ytd'?12:iv==='5y'?20:40;
  return Array.from({length:n},(_,i)=>({
    h:30+((seed*(i+7)*13)%220),up:(seed+i)%3!==0
  }));
}
function mockMetrics(id,iv){
  const s=[...id].reduce((a,c)=>a+c.charCodeAt(0),0);
  const m=iv==='ytd'?1:iv==='5y'?5:10;
  const r=(a,b,k)=>+(a+((s*k)%(b-a))).toFixed(2);
  return {
    'All-Time High':'$'+r(100,9999,17)*m,
    'All-Time Low' :'$'+r(1,200,3),
    'Avg. Return'  :r(-15,80,7)+'%',
    'Volatility'   :r(20,95,11)+'%',
    'Sharpe Ratio' :r(0.4,3.2,13).toFixed(2),
    'Max Drawdown' :'-'+r(20,85,5)+'%',
    'Total Volume' :'$'+r(1,900,9)+'B',
    'Market Cap'   :'$'+r(5,8000,19)+'B',
  };
}

async function loadCoins(){
  if(S.coinsState==='loading') return;
  S.coinsState='loading';
  render();
  try{
    const pages=await Promise.all([1,2,3,4,5].map(pg=>
      fetch(
        `https://api.coingecko.com/api/v3/coins/markets`+
        `?vs_currency=usd&order=market_cap_desc`+
        `&per_page=100&page=${pg}&sparkline=false`+
        `&price_change_percentage=24h`
      ).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
    ));
    S.coins=pages.flat().filter(c=>c&&c.id).map(c=>({
      id   : c.id,
      name : c.name,
      sym  : (c.symbol||'').toUpperCase(),
      price: c.current_price||0,
      chg  : c.price_change_percentage_24h||0,
      logo : c.image||'',
      rank : c.market_cap_rank||999,
      mcap : c.market_cap||0,
      vol  : c.total_volume||0,
    }));
    S.coinsState='ok';
  }catch(e){
    S.coinsState='err';
    console.warn('CoinGecko error:',e.message);
  }
  render();
}

async function loadOrders(){
  if(S.ordersLoading) return;
  S.ordersLoading=true;
  render();
  const res=await DB.list('orders',[Query.orderDesc('$createdAt'),Query.limit(100)]);
  S.orders=res.documents.map(d=>({
    id          : d.$id,
    userId      : d.userId,
    userName    : d.userName,
    userInitials: d.userInitials,
    category    : d.category,
    type        : d.type,
    title       : d.title,
    price       : d.price,
    desc        : d.desc||'',
    status      : d.status,
    createdAt   : d.$createdAt,
  }));
  S.ordersLoading=false;
  render();
}

async function loadChat(){
  if(S.msgsLoading) return;
  S.msgsLoading=true;
  render();
  const res=await DB.list('chat',[Query.orderAsc('$createdAt'),Query.limit(200)]);
  S.msgs=res.documents.map(d=>({
    id      : d.$id,
    userId  : d.userId,
    userName: d.userName,
    inits   : d.initials,
    text    : d.text,
    own     : S.user?.id===d.userId,
    ts      : d.$createdAt,
  }));
  S.msgsLoading=false;
  render();
}

async function loadWatchlist(){
  if(!S.user) return;
  const res=await DB.list('watchlist',[Query.equal('userId',[S.user.id]),Query.limit(1)]);
  const doc=res.documents[0];
  if(doc){
    S.watchlist=new Set(doc.coinIds||[]);
    S.wlDocId=doc.$id;
  }
}

async function saveWatchlist(){
  if(!S.user) return;
  const coinIds=[...S.watchlist];
  try{
    if(S.wlDocId){
      await DB.update('watchlist',S.wlDocId,{coinIds});
    } else {
      const doc=await DB.create('watchlist',{userId:S.user.id,coinIds});
      S.wlDocId=doc.$id;
    }
  }catch(e){console.warn('wl save:',e.message);}
}

function render(){
  const root=document.getElementById('root');
  if     (S.page==='land')   root.innerHTML=P.land();
  else if(S.page==='profile') root.innerHTML=P.profile();
  else if(S.page==='market')  root.innerHTML=P.market();
  else if(S.page==='crypto')  root.innerHTML=P.crypto();
  else                        root.innerHTML=P.land();

  const fab=document.getElementById('fab');
  (S.page==='market'&&S.mTab==='board')
    ?fab.classList.remove('hidden')
    :fab.classList.add('hidden');

  renderNav();
  lucide.createIcons();

  const feed=document.getElementById('cfeed');
  if(feed) feed.scrollTop=feed.scrollHeight;
}

function renderNav(){
  const el=document.getElementById('nact');
  if(S.user){
    el.innerHTML=`
      <div class="nubadge" onclick="R.go('profile')">
        <div class="navat">${S.user.inits[0]}</div>
        <span>${S.user.name.split(' ')[0]}</span>
      </div>`;
  } else {
    el.innerHTML=`
      <button class="btn bg bsm" onclick="M.auth()">Sign In</button>
      <button class="btn bp bsm" onclick="M.auth()">Get Started</button>`;
  }
  lucide.createIcons();
}

const P = {

  land(){
    return `
    <div id="pg-land" class="page">
      <p class="l-ey">The unified commerce layer</p>
      <h1 class="l-h">Your passport to <em>trade & access </em> the globe. 🌎</h1>

        <div class="gcard" onclick="R.acct()">

            <i data-lucide="arrow-right" style="width:16px;height:16px"></i>

            <span>Enter Marketplace</span>
            <i data-lucide="arrow-right" style="width:16px;height:16px"></i>

  },

                    </button>
                  `:''}
                  <button class="btn bo bsm" onclick="event.stopPropagation();A.viewOrder('${o.id}')">
                    <i data-lucide="eye" style="width:12px;height:12px"></i> View
                  </button>
                </div>
              </div>
            </div>
          </div>`).join('')}
        </div>
      `}`;
  },

  _forum(){
    if(S.msgsLoading){
      return `<div class="chat-wrap"><div class="chat-empty"><div class="spin"></div><br>Loading forum…</div></div>`;
    }
    const msgs=S.msgs||[];
    return `
      <div class="chat-wrap">
        <div class="chat-hdr">
          <div class="cdot"></div>
          <span style="font-weight:600;font-size:.9375rem">Datum Open Forum</span>
          <span style="font-size:.8125rem;color:var(--t2);margin-left:8px">${msgs.length} messages</span>
          <span style="margin-left:auto;font-size:.72rem;color:var(--t3)">Messages are public</span>
        </div>
        <div class="chat-feed" id="cfeed">
          ${msgs.length===0
            ?'<div class="chat-empty">No messages yet. Be the first to say something!</div>'
            :msgs.map(m=>`
            <div class="cmsg ${m.own?'own':''}">
              <div class="cavat">${m.inits}</div>
              <div class="cbwrap">
                ${!m.own?`<div class="csender">${m.userName}</div>`:''}
                <div class="cbub">${m.text}</div>
                <div class="ctime">${ago(m.ts)}</div>
              </div>
            </div>`).join('')
          }
        </div>
        <div class="chat-ibar">
          <input type="text" id="cinput"
            placeholder="${S.user?'Share a thought with the forum…':'Sign in to join the conversation…'}"
            ${!S.user?'disabled':''}
            onkeydown="if(event.key==='Enter')A.sendMsg()" />
          <button class="csendbtn" onclick="A.sendMsg()" ${!S.user?'disabled':''}>
            <i data-lucide="send" style="width:15px;height:15px"></i>
          </button>
        </div>
      </div>`;
  },

  crypto(){
    const sub=S.cryptoSub;
    const total=S.coins.length;
    const subtitle=S.coinsState==='loading'?'Fetching live data from CoinGecko…'
      :S.coinsState==='err'?'Could not reach CoinGecko — retry below'
      :total>0?`${total.toLocaleString()} assets tracked live`
      :'Initialising…';
    return `
    <div id="pg-crypto" class="page">
      <div class="pghdr">
        <div>
          <button class="back" onclick="R.go('land')">
            <i data-lucide="arrow-left" style="width:15px;height:15px"></i> Back
          </button>
          <h1 class="pgttl">Crypto Markets</h1>
          <p class="pgsub">${subtitle}</p>
        </div>
        ${S.coinsState==='err'?`<button class="btn bo bsm" onclick="loadCoins()">
          <i data-lucide="refresh-cw" style="width:14px;height:14px"></i> Retry
        </button>`:''}
      </div>
      <div class="csubnav">
        <button class="tbtn ${sub==='market'?'on':''}" onclick="A.setCryptoSub('market')">
          <i data-lucide="trending-up" style="width:13px;height:13px"></i><span>Market</span>
        </button>
        <button class="tbtn ${sub==='watchlist'?'on':''}" onclick="A.setCryptoSub('watchlist')">
          <i data-lucide="star" style="width:13px;height:13px"></i><span>Watchlist</span>
        </button>
        <button class="tbtn ${sub==='portfolio'?'on':''}" onclick="A.setCryptoSub('portfolio')">
          <i data-lucide="pie-chart" style="width:13px;height:13px"></i><span>Portfolio</span>
        </button>
      </div>
      ${sub==='market'?P._mktTable():sub==='deepdive'?P._deepdive():sub==='watchlist'?P._watchlist():P._portfolio()}
    </div>`;
  },

  _mktTable(){
    if(S.coinsState==='loading'||S.coinsState==='idle'){
      return `<div class="mtwrap"><div class="lrow"><div class="spin"></div><br>Fetching 500 assets from CoinGecko…</div></div>`;
    }
    if(S.coinsState==='err'&&S.coins.length===0){
      return `<div class="mtwrap"><div class="lrow" style="color:var(--red)">
        <i data-lucide="alert-circle" style="width:24px;height:24px;display:block;margin:0 auto 10px"></i>
        Could not load market data. Check your connection and retry.
      </div></div>`;
    }
    const q=S.csearch.toLowerCase().trim();
    const filtered=q?S.coins.filter(c=>c.name.toLowerCase().includes(q)||c.sym.toLowerCase().includes(q)):S.coins;
    const total=filtered.length;
    const pages=Math.max(1,Math.ceil(total/S.cps));
    const pg=Math.min(S.cpage,pages);
    const start=(pg-1)*S.cps;
    const slice=filtered.slice(start,start+S.cps);
    const maxPagesShown=7;

    return `
      <div class="mtbar">
        <div class="swrap">
          <i data-lucide="search" style="width:14px;height:14px"></i>
          <input type="text" placeholder="Search assets…" value="${S.csearch}"
                 oninput="A.cSearch(this.value)"/>
        </div>
        <span style="font-size:.8rem;color:var(--t2);margin-left:auto">${total.toLocaleString()} result${total!==1?'s':''}</span>
      </div>
      <div class="mtwrap">
        <table>
          <thead>
            <tr>
              <th style="width:38px">#</th>
              <th>Asset</th>
              <th class="r">Price</th>
              <th class="r">24h</th>
              <th class="r" style="width:48px">★</th>
            </tr>
          </thead>
          <tbody>
            ${slice.map((c,i)=>{
              const idx=start+i;
              const pos=c.chg>=0;
              const st=S.watchlist.has(c.id);
              return `
              <tr onclick="A.openCoin('${c.id}')">
                <td style="color:var(--t3);font-size:.78rem">${c.rank||idx+1}</td>
                <td><div class="acell">
                  ${coinIcon(c,idx,34)}
                  <div><div class="aname">${c.name}</div><div class="asym">${c.sym}</div></div>
                </div></td>
                <td class="r price-c">${fmtp(c.price)}</td>
                <td class="r ${pos?'cp':'cn'}">${fmtpct(c.chg)}</td>
                <td class="r" onclick="event.stopPropagation()">
                  <button class="wbtn ${st?'on':''}" onclick="A.toggleWatch('${c.id}')">
                    <i data-lucide="star" style="width:15px;height:15px;${st?'fill:currentColor':''}"></i>
                  </button>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        <div class="pgn">
          <span class="pgninf">Page ${pg} / ${pages} &nbsp;•&nbsp; ${total.toLocaleString()} assets</span>
          <div class="pgnc">
            <button class="pgbtn" onclick="A.cPage(${pg-1})" ${pg<=1?'disabled':''}>
              <i data-lucide="chevron-left" style="width:13px;height:13px"></i>
            </button>
            ${Array.from({length:Math.min(pages,maxPagesShown)},(_,i)=>{
              const p=i+1;
              return `<button class="pgbtn ${p===pg?'on':''}" onclick="A.cPage(${p})">${p}</button>`;
            }).join('')}
            ${pages>maxPagesShown?`<span style="padding:0 4px;color:var(--t3);font-size:.78rem">…${pages}</span>`:''}
            <button class="pgbtn" onclick="A.cPage(${pg+1})" ${pg>=pages?'disabled':''}>
              <i data-lucide="chevron-right" style="width:13px;height:13px"></i>
            </button>
          </div>
        </div>
      </div>`;
  },

  _deepdive(){
    const coin=S.coins.find(c=>c.id===S.selCoin);
    if(!coin) return '<p style="padding:40px;color:var(--t2)">Asset not found.</p>';
    const idx=S.coins.indexOf(coin);
    const pos=coin.chg>=0;
    const iv=S.interval;
    const bars=mockBars(coin.id,iv);
    const maxH=Math.max(...bars.map(b=>b.h));
    const mets=mockMetrics(coin.id,iv);
    const xlabels={
      ytd:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
      '5y':['2020','2021','2022','2023','2024'],
      '10y':['2015','2016','2017','2018','2019','2020','2021','2022','2023','2024'],
    };
    const st=S.watchlist.has(coin.id);
    const [bg,fg]=COLORS[idx%COLORS.length];

    return `
      <button class="back" onclick="A.setCryptoSub('market')">
        <i data-lucide="arrow-left" style="width:15px;height:15px"></i> Back to Market
      </button>
      <div class="ahero">
        <div class="aherol">
          <div class="aheroico" style="${coin.logo?'background:#f0f0f0':'background:'+bg+';color:'+fg}">
            ${coin.logo
              ?`<img src="${coin.logo}" alt="${coin.sym}" width="54" height="54"
                    onerror="this.parentNode.style.background='${bg}';this.parentNode.style.color='${fg}';this.parentNode.innerHTML='${coin.sym.slice(0,3)}'">`
              :coin.sym.slice(0,3)}
          </div>
          <div>
            <div class="aheroname">${coin.name}</div>
            <div class="aherosym">${coin.sym} &nbsp;•&nbsp; Rank #${coin.rank||idx+1}</div>
          </div>
        </div>
        <div style="text-align:right">
          <div class="aheroprice">${fmtp(coin.price)}</div>
          <div class="${pos?'cp':'cn'}" style="font-size:.95rem;font-weight:500;margin-top:4px">${fmtpct(coin.chg)} (24h)</div>
          <div style="margin-top:12px">
            <button class="btn bo bsm" onclick="A.toggleWatch('${coin.id}');render()">
              <i data-lucide="star" style="width:13px;height:13px;${st?'fill:var(--gld);color:var(--gld)':''}"></i>
              ${st?'Watchlisted':'Add to Watchlist'}
            </button>
          </div>
        </div>
      </div>
      <div class="itabs">
        ${['ytd','5y','10y'].map(iv2=>`
          <button class="ibtn ${iv===iv2?'on':''}" onclick="A.setIv('${iv2}')">${iv2.toUpperCase()}</button>
        `).join('')}
      </div>
      <div class="chartwrap">
        <div class="chartarea" style="padding-top:36px">
          <span class="cylabel">${coin.sym}/USD — ${iv.toUpperCase()} Performance (illustrative)</span>
          ${bars.map(b=>`
            <div class="cbar" style="height:${Math.round((b.h/maxH)*220)}px;background:${b.up?'var(--grn)':'var(--red)'};opacity:.72"></div>
          `).join('')}
        </div>
        <div class="cxlabels">
          ${xlabels[iv].map(l=>`<span>${l}</span>`).join('')}
        </div>
      </div>
      <div class="mgrid">
        ${Object.entries(mets).map(([k,v])=>`
          <div class="mc">
            <div class="mcl">${k}</div>
            <div class="mcv">${v}</div>
            <div class="mcs">${iv.toUpperCase()} period</div>
          </div>`).join('')}
      </div>`;
  },

  _watchlist(){
    const starred=S.coins.filter(c=>S.watchlist.has(c.id));
    if(starred.length===0){
      return `
        <div class="wempty">
          <div class="wemi"><i data-lucide="star" style="width:26px;height:26px"></i></div>
          <div class="wemt">Your watchlist is empty</div>
          <p style="font-size:.875rem">Star assets from the market table to track them here.</p>
          <button class="btn bp" style="margin-top:18px" onclick="A.setCryptoSub('market')">Browse Market</button>
        </div>`;
    }
    return `
      <div class="mtwrap">
        <table>
          <thead>
            <tr>
              <th>Asset</th><th class="r">Price</th><th class="r">24h</th>
              <th class="r" style="width:48px">★</th>
            </tr>
          </thead>
          <tbody>
            ${starred.map((c)=>{
              const idx=S.coins.indexOf(c);
              const pos=c.chg>=0;
              return `
              <tr onclick="A.openCoin('${c.id}')">
                <td><div class="acell">
                  ${coinIcon(c,idx,34)}
                  <div><div class="aname">${c.name}</div><div class="asym">${c.sym}</div></div>
                </div></td>
                <td class="r price-c">${fmtp(c.price)}</td>
                <td class="r ${pos?'cp':'cn'}">${fmtpct(c.chg)}</td>
                <td class="r" onclick="event.stopPropagation()">
                  <button class="wbtn on" onclick="A.toggleWatch('${c.id}')">
                    <i data-lucide="star" style="width:15px;height:15px;fill:currentColor"></i>
                  </button>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
  },

  _portfolio(){
    return `
      <div style="display:flex;align-items:center;justify-content:center;padding:56px 24px">
        <div class="cscard">
          <div class="csgfx"><i data-lucide="line-chart" style="width:48px;height:48px"></i></div>
          <div class="csbadge"><i data-lucide="clock" style="width:11px;height:11px"></i> Coming Soon</div>
          <h2 class="cst">Portfolio Tracker</h2>
          <p class="css">Automated portfolio tracking with real-time P&L, allocation charts, and multi-exchange sync is in development. Join the waitlist to be first in line.</p>
          <button class="btn bp" style="margin-top:26px">
            <i data-lucide="bell" style="width:14px;height:14px"></i> Join Waitlist
          </button>
        </div>
      </div>`;
  },
};

const M = {
  show(html){
    document.getElementById('mroot').innerHTML=html;
    lucide.createIcons();
  },
  close(){
    document.getElementById('mroot').innerHTML='';
    S.authTab='login'; S.signupType=null;
  },

  auth(){
    const login=S.authTab!=='signup';
    M.show(`
    <div class="mback" onclick="if(event.target===this)M.close()">
      <div class="modal">
        <div class="mhdr">
          <div>
            <div class="mey">${login?'Welcome back':'Create account'}</div>
            <h2 class="mtitle">${login?'Sign In':'Join Datum'}</h2>
          </div>
          <button class="mclose" onclick="M.close()">
            <i data-lucide="x" style="width:15px;height:15px"></i>
          </button>
        </div>
        <div class="mtabs">
          <button class="mtab ${login?'on':''}" onclick="A.authTab('login')">Sign In</button>
          <button class="mtab ${!login?'on':''}" onclick="A.authTab('signup')">Create Account</button>
        </div>
        ${login?M._loginForm():M._signupForm()}
      </div>
    </div>`);
  },

  _loginForm(){
    return `
      <div class="fg">
        <label>Email Address</label>

               onkeydown="if(event.key==='Enter')A.login()"/>

        <label>Password</label>
        <input type="password" id="lpwd" placeholder="••••••••" autocomplete="current-password"
               onkeydown="if(event.key==='Enter')A.login()"/>
      </div>
      <div class="ferr" id="lerr"></div>
      <button class="btn bp" id="lbtn" style="width:100%;justify-content:center;padding:12px;margin-top:4px" onclick="A.login()">
        Sign In
      </button>
      <div class="aswitch">Don't have an account? <a onclick="A.authTab('signup')">Register here</a></div>`;
  },

  _signupForm(){
    const sel=S.signupType;
    return `
      <div class="fg">
        <label>Full Name</label>
        <input type="text" id="sname" placeholder="Fullname" autocomplete="name"/>
      </div>
      <div class="fg">
        <label>Email Address</label>
        <input type="email" id="semail" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="fg">
        <label>Password</label>
        <input type="password" id="spwd" placeholder="Min. 8 characters" autocomplete="new-password"
               onkeydown="if(event.key==='Enter')A.signup()"/>
      </div>
      <div class="fg">
        <label>Account Type</label>
        <div class="utgrid">
          <div class="utcard ${sel==='A'?'on':''}" onclick="A.setUType('A')">
            <div class="uticon"><i data-lucide="briefcase" style="width:19px;height:19px"></i></div>
            <div class="utn">Business</div>
            <div class="utd">Merchants, Vendors, Artisans, Service providers.</div>
          </div>
          <div class="utcard ${sel==='B'?'on':''}" onclick="A.setUType('B')">
            <div class="uticon"><i data-lucide="user" style="width:19px;height:19px"></i></div>
            <div class="utn">Individual</div>
            <div class="utd">Personal traders, P2P buyers/sellers.</div>
          </div>
        </div>
      </div>
      <div class="ferr" id="serr"></div>
      <button class="btn bp" id="sbtn" style="width:100%;justify-content:center;padding:12px;margin-top:4px" onclick="A.signup()">
        Create Account
      </button>
      <div class="aswitch">Already have an account? <a onclick="A.authTab('login')">Sign in</a></div>`;
  },

  createOrder(){
    if(!S.user){M.auth();toast('Please sign in to post a listing.');return;}
    M.show(`
    <div class="mback" onclick="if(event.target===this)M.close()">
      <div class="modal">
        <div class="mhdr">
          <div><div class="mey">New Listing</div><h2 class="mtitle">Post an Order</h2></div>
          <button class="mclose" onclick="M.close()"><i data-lucide="x" style="width:15px;height:15px"></i></button>
        </div>
        <div class="fg">
          <label>Title</label>
          <input type="text" id="otitle" placeholder="e.g. Sell 0.1 ETH at spot rate"/>
        </div>
        <div class="fg">
          <label>Category</label>
          <select id="ocat">
            <option value="">Select…</option>
            <option value="p2p">P2P Crypto Trading</option>
            <option value="logistics">Logistics / Delivery</option>
            <option value="goods">Buy / Sell Goods</option>
            <option value="handyman">Handyman / Service</option>
          </select>
        </div>
        <div class="fg">
          <label>Order Type</label>
          <select id="otype">
            <option value="sell">Sell</option>
            <option value="buy">Buy</option>
            <option value="request">Service Request</option>
          </select>
        </div>
        <div class="fg">
          <label>Price / Budget</label>
          <input type="text" id="oprice" placeholder="e.g. ₦850,000 or Negotiable"/>
        </div>
        <div class="fg">
          <label>Description</label>
          <textarea id="odesc" rows="3" placeholder="Full details of your listing…"></textarea>
        </div>
        <div class="ferr" id="oerr"></div>
        <button class="btn bp" id="obtn" style="width:100%;justify-content:center;padding:12px;margin-top:4px" onclick="A.submitOrder()">
          <i data-lucide="send" style="width:14px;height:14px"></i> Post Listing
        </button>
      </div>
    </div>`);
  },

  viewOrder(order){
    const sc={open:'tg',negotiating:'to',filled:'tn',closed:'tn'};
    const tc={buy:'tb',sell:'tg',request:'to'};
    const catLabel={p2p:'P2P Crypto',logistics:'Logistics',goods:'Buy/Sell Goods',handyman:'Handyman'}[order.category]||order.category;
    const mine=S.user?.id===order.userId;
    const done=order.status==='filled'||order.status==='closed';
    M.show(`
    <div class="mback" onclick="if(event.target===this)M.close()">
      <div class="modal modal-lg">
        <div class="mhdr">
          <div><div class="mey">Order Details</div><h2 class="mtitle" style="font-size:1.35rem">Listing Preview</h2></div>
          <button class="mclose" onclick="M.close()"><i data-lucide="x" style="width:15px;height:15px"></i></button>
        </div>
        <div class="odh">
          <div class="odtags">
            <span class="tag ${sc[order.status]||'tn'}">${order.status}</span>
            <span class="tag ${tc[order.type]||'tn'}">${order.type}</span>
            <span class="tag tn">${catLabel}</span>
          </div>
          <div class="odtitle">${order.title}</div>
          <div class="odprice">${order.price}</div>
          <div style="font-size:.78rem;color:var(--t3);margin-top:4px">Posted ${ago(order.createdAt)}</div>
        </div>
        <div style="margin-bottom:18px">
          <div style="font-weight:600;font-size:.875rem;margin-bottom:9px">Description</div>
          <div style="font-size:.9rem;color:var(--t2);line-height:1.65">${order.desc||'No description provided.'}</div>
        </div>
        <div class="odmeta">
          <div class="odmi"><div class="odml">Type</div><div class="odmv" style="text-transform:capitalize">${order.type}</div></div>
          <div class="odmi"><div class="odml">Category</div><div class="odmv">${catLabel}</div></div>
          <div class="odmi"><div class="odml">Status</div><div class="odmv" style="text-transform:capitalize">${order.status}</div></div>
          <div class="odmi"><div class="odml">Posted</div><div class="odmv">${ago(order.createdAt)}</div></div>
        </div>
        <div class="selcard">
          <div class="selavat">${order.userInitials}</div>
          <div>
            <div class="selname">${order.userName}</div>
            <div class="selstat">
              <span class="tag tg" style="margin-right:6px"><i data-lucide="check-circle" style="width:10px;height:10px"></i> Verified</span>
              Member on Datum
            </div>
          </div>
        </div>
        ${!done&&!mine?`
        <div class="cform">
          <div class="cformtitle">Send a Connection Request</div>
          <div class="fg">
            <label>Your message to ${order.userName.split(' ')[0]}</label>
            <textarea id="cmsg" rows="3" placeholder="Introduce yourself. Why are you the right person for this order?"></textarea>
          </div>

            <label>Your contact (phone, WhatsApp, Telegram, or email)</label>
            <input type="text" id="ccontact" placeholder="e.g. +234 801 234 5678"/>
          </div>
          <div class="ferr" id="cerr"></div>
          <div style="display:flex;gap:10px">
            <button class="btn bc" style="flex:1;justify-content:center" onclick="A.submitConnect('${order.id}','${order.userName}')">
              <i data-lucide="plug" style="width:14px;height:14px"></i> Send Request
            </button>
            <button class="btn bo" onclick="M.close()">Cancel</button>
          </div>
        </div>
        `:''}
        ${done?`<div style="background:var(--surf);border-radius:var(--rmd);padding:14px;text-align:center;color:var(--t2);font-size:.875rem">
          <i data-lucide="check-circle-2" s          <i data-lucide="check-circle-2" style="width:18px;height:18px;color:var(--grn);display:block;margin:0 auto 7px"></i>
          This order is no longer accepting connections.
        </div>`:``}
        ${mine?`<div style="background:#E8EEFB;border-radius:var(--rmd);padding:14px;text-align:center;font-size:.875rem;color:var(--blu)">
          <i data-lucide="info" style="width:15px;height:15px;display:inline-block;vertical-align:-3px;margin-right:6px"></i>
          This is your listing — you cannot connect to your own order.
        </div>`:``}
      </div>
    </div>`);
  },
};

const R = {
  go(page){
    S.page=page;
    if(page==='market'){
      S.mTab='board';S.mFilter='all';
      loadOrders();
    }
    if(page==='crypto'&&S.coinsState==='idle'){
      loadCoins();
    }
    render();
  },
  acct(){
    S.user?R.go('profile'):M.auth();
  },
};

const A = {

  authTab(t){ S.authTab=t; M.auth(); },
  setUType(t){ S.signupType=t; M.auth(); },

  async login(){
    const email=document.getElementById('lemail')?.value?.trim();
    const pwd  =document.getElementById('lpwd')?.value;
    const err  =document.getElementById('lerr');
    const btn  =document.getElementById('lbtn');
    if(!email||!pwd){err.textContent='Please fill in all fields.';return;}
    btn.disabled=true; btn.textContent='Signing in\u2026';
    try{
      await DB.login(email,pwd);
      const u=await DB.me();
      if(!u) throw new Error('No session');
      const res=await DB.list('profiles',[Query.equal('userId',[u.$id]),Query.limit(1)]);
      const p=res.documents[0];
      S.user={id:u.$id,name:p?.name||u.name,email:u.email,type:p?.type||'B',inits:initials(p?.name||u.name)};
      await loadWatchlist();
      M.close(); R.go('profile');
      toast('Welcome back, '+S.user.name.split(' ')[0]+'!','ok');
    }catch(e){
      err.textContent='Login failed: '+(e.message.includes('401')||e.message.includes('invalid')?'Wrong email or password.':e.message);
      btn.disabled=false; btn.textContent='Sign In';
    }
  },

  async signup(){
    const name =document.getElementById('sname')?.value?.trim();
    const email=document.getElementById('semail')?.value?.trim();
    const pwd  =document.getElementById('spwd')?.value;
    const type =S.signupType;
    const err  =document.getElementById('serr');
    const btn  =document.getElementById('sbtn');
    if(!name||!email||!pwd){err.textContent='Please fill in all fields.';return;}
    if(!type){err.textContent='Please select an account type.';return;}
    btn.disabled=true; btn.textContent='Creating account\u2026';
    try{
      const u=await DB.register(email,pwd,name);
      await DB.login(email,pwd);
      await DB.create('profiles',{userId:u.$id,name,email,type});
      S.user={id:u.$id,name,email,type,inits:initials(name)};
      M.close(); R.go('profile');
      toast('Account created! Welcome, '+name.split(' ')[0]+'.','ok');
    }catch(e){
      err.textContent='Signup failed: '+(e.message.includes('409')?'Email already in use.':e.message);
      btn.disabled=false; btn.textContent='Create Account';
    }
  },

  async logout(){
    await DB.logout();
    S.user=null; S.watchlist=new Set(); S.wlDocId=null;
    R.go('land');
    toast('You have been signed out.');
  },

  setMTab(t){
    S.mTab=t;
    if(t==='board') loadOrders();
    if(t==='forum') loadChat();
    render();
  },
  setFilter(f){ S.mFilter=f; render(); },

  viewOrder(id){
    const o=(S.orders||[]).find(x=>x.id===id);
    if(!o) return;
    S.viewedOrder=o;
    M.viewOrder(o);
  },

  connectOrder(id){
    if(!S.user){M.auth();toast('Please sign in to connect with sellers.');return;}
    A.viewOrder(id);
    setTimeout(()=>{
      const cf=document.querySelector('.cform');
      if(cf){cf.scrollIntoView({behavior:'smooth',block:'start'});}
      const ta=document.getElementById('cmsg');
      if(ta) ta.focus();
    },120);
  },

  submitConnect(orderId, sellerName){
    const msg    =document.getElementById('cmsg')?.value?.trim();
    const contact=document.getElementById('ccontact')?.value?.trim();
    const err    =document.getElementById('cerr');
    if(!msg){err.textContent='Please write a message.';return;}
    if(!contact){err.textContent='Please provide your contact details.';return;}
    M.close();
    toast('Connection request sent to '+sellerName+'!','ok');
  },

  async submitOrder(){
    const title=document.getElementById('otitle')?.value?.trim();
    const cat  =document.getElementById('ocat')?.value;
    const type =document.getElementById('otype')?.value;
    const price=document.getElementById('oprice')?.value?.trim();
    const desc =document.getElementById('odesc')?.value?.trim();
    const err  =document.getElementById('oerr');
    const btn  =document.getElementById('obtn');
    if(!title){err.textContent='Please add a title.';return;}
    if(!cat)  {err.textContent='Please select a category.';return;}
    if(!price){err.textContent='Please add a price or budget.';return;}
    btn.disabled=true; btn.textContent='Posting\u2026';
    const inits2=initials(S.user.name);
    try{
      const doc=await DB.create('orders',{
        userId:S.user.id,
        userName:S.user.name,
        userInitials:inits2,
        category:cat,type,title,
        price:price||'Negotiable',
        desc:desc||'',
        status:'open',
      });
      if(!S.orders) S.orders=[];
      S.orders.unshift({id:doc.$id,userId:S.user.id,userName:S.user.name,
        userInitials:inits2,category:cat,type,title,price:price||'Negotiable',
        desc:desc||'',status:'open',createdAt:doc.$createdAt||new Date().toISOString()});
      M.close(); render();
      toast('Listing posted!','ok');
    }catch(e){
      err.textContent='Failed: '+e.message;
      btn.disabled=false; btn.textContent='Post Listing';
    }
  },

  async sendMsg(){
    const inp=document.getElementById('cinput');
    const txt=inp?.value?.trim();
    if(!txt||!S.user) return;
    inp.value='';
    const now=new Date().toISOString();
    const msg={id:'l'+Date.now(),userId:S.user.id,userName:S.user.name,
               inits:S.user.inits,text:txt,own:true,ts:now};
    if(!S.msgs) S.msgs=[];
    S.msgs.push(msg);
    render();
    DB.create('chat',{userId:S.user.id,userName:S.user.name,
      initials:S.user.inits,text:txt})
      .catch(e=>console.warn('chat persist:',e.message));
  },

  setCryptoSub(s){ S.cryptoSub=s; render(); },
  setIv(iv){ S.interval=iv; render(); },
  cSearch(q){ S.csearch=q; S.cpage=1; render(); },
  cPage(p){
    const q=S.csearch.toLowerCase().trim();
    const coins=q?S.coins.filter(c=>c.name.toLowerCase().includes(q)||c.sym.toLowerCase().includes(q)):S.coins;
    const pages=Math.max(1,Math.ceil(coins.length/S.cps));
    if(p<1||p>pages) return;
    S.cpage=p; render();
  },
  openCoin(id){ S.selCoin=id; S.cryptoSub='deepdive'; S.interval='ytd'; render(); },
  toggleWatch(id){
    S.watchlist.has(id)?S.watchlist.delete(id):S.watchlist.add(id);
    saveWatchlist();
    if(S.cryptoSub==='deepdive'||S.cryptoSub==='watchlist'){ render(); return; }
    document.querySelectorAll('.wbtn').forEach(b=>{
      if((b.getAttribute('onclick')||'').includes("'"+id+"'")){
        const on=S.watchlist.has(id);
        b.className='wbtn'+(on?' on':'');
        const ic=b.querySelector('i');
        if(ic) ic.setAttribute('style','width:15px;height:15px;'+(on?'fill:currentColor':''));
      }
    });
    lucide.createIcons();
  },
};

document.addEventListener('DOMContentLoaded', async ()=>{
  const u=await DB.me();
  if(u){
    const res=await DB.list('profiles',[Query.equal('userId',[u.$id]),Query.limit(1)]);
    const p=res.documents[0];
    S.user={id:u.$id,name:p?.name||u.name,email:u.email,
            type:p?.type||'B',inits:initials(p?.name||u.name)};
    await loadWatchlist();
  }
  render();
  loadCoins();
});
</script>
</body>
</html>
