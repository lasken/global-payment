<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Toomuchcoin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0/dist/iife/sdk.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://checkout.flutterwave.com/v3.js"></script>
  <script src="config.js" onerror="console.warn('config.js not found')"></script>
  <style>
    :root{
      --white:#fff;--off:#F8F7F4;--surf:#F2F1EE;--bdr:#E4E2DC;--bdr2:#C8C5BC;
      --t1:#1A1916;--t2:#6B6860;--t3:#A8A49C;
      --grn:#1A7A4A;--red:#C43030;--blu:#2B5BE0;--org:#C4622D;--gld:#B8892A;--pur:#7C3AED;
      --rsm:6px;--rmd:12px;--rlg:20px;
      --s1:0 1px 3px rgba(26,25,22,.06),0 1px 2px rgba(26,25,22,.04);
      --s2:0 4px 16px rgba(26,25,22,.08),0 2px 6px rgba(26,25,22,.05);
      --s3:0 16px 48px rgba(26,25,22,.12),0 6px 20px rgba(26,25,22,.07);
      --ease:all .22s cubic-bezier(.4,0,.2,1);
      --fd:'DM Serif Display',Georgia,serif;
      --fb:'DM Sans',system-ui,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px;scroll-behavior:smooth}
    body{font-family:var(--fb);background:var(--white);color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    .hidden{display:none!important}
    img{display:block}

    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:var(--rsm);font-family:var(--fb);font-size:.875rem;font-weight:500;cursor:pointer;border:none;transition:var(--ease);text-decoration:none;white-space:nowrap}
    .btn:disabled{opacity:.5;cursor:not-allowed!important;transform:none!important}
    @media(min-width:769px){.pghdr .btn{margin-top:22px}}
    .bp{background:var(--t1);color:var(--white)}
    .bp:hover:not(:disabled){background:#333028;transform:translateY(-1px);box-shadow:var(--s2)}
    .bo{background:transparent;color:var(--t1);border:1.5px solid var(--bdr2)}
    .bo:hover:not(:disabled){border-color:var(--t1);background:var(--off)}
    .bg{background:transparent;color:var(--t2);padding:8px 12px}
    .bg:hover{background:var(--surf);color:var(--t1)}
    .bsm{padding:7px 14px;font-size:.8125rem}
    .bc{background:var(--grn);color:var(--white)}
    .bc:hover:not(:disabled){background:#155f39;transform:translateY(-1px)}
    .bpur{background:var(--pur);color:var(--white)}
    .bpur:hover:not(:disabled){background:#6d28d9;transform:translateY(-1px);box-shadow:var(--s2)}

    .tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:100px;font-size:.75rem;font-weight:500}
    .tg{background:#E6F5EE;color:var(--grn)}
    .tr{background:#FDEAEA;color:var(--red)}
    .tb{background:#E8EEFB;color:var(--blu)}
    .to{background:#FDF0EA;color:var(--org)}
    .tgd{background:#FBF4E6;color:var(--gld)}
    .tn{background:var(--surf);color:var(--t2)}
    .tpur{background:#F3EEFF;color:var(--pur)}

    input,textarea,select{font-family:var(--fb);font-size:.875rem;border:1.5px solid var(--bdr);border-radius:var(--rsm);padding:10px 14px;width:100%;background:var(--white);color:var(--t1);outline:none;transition:var(--ease);appearance:none}
    input:focus,textarea:focus,select:focus{border-color:var(--t1);box-shadow:0 0 0 3px rgba(26,25,22,.08)}
    input::placeholder,textarea::placeholder{color:var(--t3)}
    input:disabled,textarea:disabled{background:var(--surf);cursor:not-allowed;color:var(--t3)}
    label{display:block;font-size:.8125rem;font-weight:500;color:var(--t2);margin-bottom:6px}
    .fg{margin-bottom:18px}
    .ferr{font-size:.75rem;color:var(--red);margin-top:5px;min-height:18px}
    .pfx{position:relative;display:flex;align-items:center}
    .pfx-sym{position:absolute;left:12px;color:var(--t1);font-weight:600;font-size:.95rem;pointer-events:none;z-index:1}
    .pfx input{padding-left:26px}

    #gnav{position:fixed;top:0;left:0;right:0;z-index:900;background:rgba(255,255,255,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:60px}
    .nbrand{font-family:var(--fd);font-size:1.375rem;color:var(--t1);cursor:pointer;user-select:none}
    .nbrand span{color:var(--org)}
    .nact{display:flex;align-items:center;gap:8px}
    .nubadge{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:100px;background:var(--surf);font-size:.8125rem;font-weight:500;cursor:pointer;transition:var(--ease)}
    .nubadge:hover{background:var(--bdr)}
    .navat{width:28px;height:28px;border-radius:50%;background:var(--t1);display:flex;align-items:center;justify-content:center;color:var(--white);font-size:.75rem;font-weight:600}

    .page{min-height:100vh;padding-top:60px;animation:pup .28s ease}
    @keyframes pup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    #pg-land{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:80px 24px 60px}
    .l-ey{font-size:.72rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:20px}
    .l-h{font-family:var(--fd);font-size:clamp(2.2rem,5vw,3.5rem);line-height:1.12;letter-spacing:-.02em;color:var(--t1);text-align:center;max-width:640px;margin-bottom:16px}
    .l-h em{font-style:italic;color:var(--org)}
    .l-sub{font-size:1rem;color:var(--t2);text-align:center;max-width:440px;line-height:1.6;margin-bottom:60px}
    .ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:960px;width:100%}
    .gcard{background:var(--white);border:1.5px solid var(--bdr);border-radius:var(--rlg);padding:36px 32px;cursor:pointer;transition:var(--ease);display:flex;flex-direction:column}
    .gcard:hover{border-color:var(--bdr2);transform:translateY(-4px);box-shadow:var(--s3)}
    .gci{width:48px;height:48px;border-radius:var(--rmd);display:flex;align-items:center;justify-content:center;margin-bottom:24px}
    .id{background:var(--t1);color:var(--white)}
    .iw{background:#FDF0EA;color:var(--org)}
    .ib{background:#E8EEFB;color:var(--blu)}
    .gcl{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:8px}
    .gct{font-family:var(--fd);font-size:1.5rem;line-height:1.2;color:var(--t1);margin-bottom:12px}
    .gcd{font-size:.875rem;color:var(--t2);line-height:1.6;flex:1}
    .gca{display:flex;align-items:center;gap:6px;margin-top:28px;font-size:.8125rem;font-weight:500;color:var(--t1);transition:var(--ease)}
    .gcard:hover .gca{gap:10px}

    .mback{position:fixed;inset:0;z-index:1000;background:rgba(26,25,22,.52);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fin .2s ease}
    @keyframes fin{from{opacity:0}to{opacity:1}}
    .modal{background:var(--white);border-radius:var(--rlg);padding:36px 40px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;box-shadow:var(--s3);animation:mup .24s cubic-bezier(.4,0,.2,1)}
    .modal-lg{max-width:660px}
    @keyframes mup{from{transform:translateY(16px) scale(.98);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
    .mhdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
    .mtitle{font-family:var(--fd);font-size:1.7rem;line-height:1.15}
    .mey{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:6px}
    .mclose{background:var(--surf);border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);transition:var(--ease);flex-shrink:0}
    .mclose:hover{background:var(--bdr);color:var(--t1)}
    .mtabs{display:flex;border-bottom:1.5px solid var(--bdr);margin-bottom:26px}
    .mtab{padding:10px 20px;font-size:.875rem;font-weight:500;color:var(--t3);cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:var(--ease)}
    .mtab.on{color:var(--t1);border-bottom-color:var(--t1)}
    .utgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 22px}
    .utcard{border:2px solid var(--bdr);border-radius:var(--rmd);padding:20px 16px;cursor:pointer;transition:var(--ease);text-align:center}
    .utcard.on{border-color:var(--t1);background:var(--off)}
    .uticon{width:40px;height:40px;border-radius:var(--rsm);background:var(--surf);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--t2)}
    .utcard.on .uticon{background:var(--t1);color:var(--white)}
    .utn{font-weight:600;font-size:.875rem;color:var(--t1);margin-bottom:4px}
    .utd{font-size:.72rem;color:var(--t2);line-height:1.5}
    .aswitch{text-align:center;margin-top:18px;font-size:.875rem;color:var(--t2)}
    .aswitch a{color:var(--t1);font-weight:500;cursor:pointer;text-decoration:underline}

    #pg-profile{padding:40px 24px;max-width:780px;margin:0 auto}
    .phero{display:flex;align-items:center;gap:24px;padding:28px 32px;background:var(--off);border:1px solid var(--bdr);border-radius:var(--rlg);margin-bottom:24px}
    .pavat{width:68px;height:68px;border-radius:50%;background:var(--t1);color:var(--white);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:1.6rem;flex-shrink:0}
    .pname{font-family:var(--fd);font-size:1.4rem;margin-bottom:4px}
    .pmeta{font-size:.875rem;color:var(--t2)}
    .ptbadge{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 12px;background:var(--white);border:1px solid var(--bdr);border-radius:100px;font-size:.8rem;font-weight:500}
    .pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
    .psc{background:var(--white);border:1px solid var(--bdr);border-radius:var(--rmd);padding:20px}
    .psv{font-family:var(--fd);font-size:1.7rem;margin-bottom:4px}
    .psl{font-size:.8125rem;color:var(--t2)}
    .psec{background:var(--white);border:1px solid var(--bdr);border-radius:var(--rmd);padding:22px;margin-bottom:14px}
    .psect{font-weight:600;font-size:.875rem;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
    .irow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bdr);font-size:.875rem}
    .irow:last-child{border-bottom:none}
    .irl{color:var(--t2)}
    .irv{font-weight:500}

    .cxcard{border:1px solid var(--bdr);border-radius:var(--rmd);padding:16px;margin-bottom:10px;background:var(--white)}
    .cxcard:last-child{margin-bottom:0}
    .cxhead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .cxavat{width:34px;height:34px;border-radius:50%;background:var(--t1);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;font-family:var(--fd);flex-shrink:0}
    .cxname{font-weight:600;font-size:.875rem}
    .cxorder{font-size:.75rem;color:var(--t2)}
    .cxmsg{font-size:.8125rem;color:var(--t2);line-height:1.55;margin-bottom:8px;background:var(--surf);border-radius:var(--rsm);padding:10px 12px}
    .cxcontact{font-size:.8125rem;font-weight:500;display:flex;align-items:center;gap:5px;flex-wrap:wrap}

    .vstat-box{border-radius:var(--rmd);padding:14px 16px;display:flex;align-items:flex-start;gap:12px}
    .vstat-unverified{background:var(--surf);border:1px solid var(--bdr)}
    .vstat-pending{background:#FBF4E6;border:1px solid #E8D9B0}
    .vstat-verified{background:#E6F5EE;border:1px solid #B3DFCA}
    .vstat-rejected{background:#FDEAEA;border:1px solid #F0BFBF}

    #pg-market{padding:40px 24px;max-width:1080px;margin:0 auto}
    .pghdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:16px}
    .pgttl{font-family:var(--fd);font-size:clamp(1.7rem,3vw,2.2rem);line-height:1.15;margin-bottom:6px}
    .pgsub{font-size:.9rem;color:var(--t2)}
    .tnav{display:flex;gap:4px;background:var(--surf);border-radius:var(--rmd);padding:4px;margin-bottom:26px}
    .tbtn{flex:1;padding:9px 10px;border-radius:8px;font-size:.875rem;font-weight:500;border:none;background:transparent;color:var(--t2);cursor:pointer;transition:var(--ease);display:flex;align-items:center;justify-content:center;gap:5px}
    @media (min-width: 769px) {
  .csubnav .tbtn {
    font-size: 0.78rem;
    padding: 9px 12px; 
    gap: 6px;          
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap; 
  }

  .csubnav .tbtn span {
    white-space: nowrap; 
  }

  .csubnav .tbtn i {
    width: 12px !important;
    height: 12px !important;
    flex-shrink: 0;      
  }
}
    .tbtn.on{background:var(--white);color:var(--t1);box-shadow:var(--s1)}
    .fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:22px}
    .flbl{font-size:.8125rem;font-weight:500;color:var(--t2);margin-right:4px}
    .ftag{padding:6px 14px;border-radius:100px;border:1.5px solid var(--bdr);background:var(--white);font-size:.8125rem;font-weight:500;color:var(--t2);cursor:pointer;transition:var(--ease)}
    .ftag.on,.ftag:hover{border-color:var(--t1);color:var(--t1);background:var(--off)}
    .ogrid{display:grid;gap:12px}
    .ocard{background:var(--white);border:1.5px solid var(--bdr);border-radius:var(--rmd);padding:20px 22px;transition:var(--ease);display:flex;align-items:flex-start;gap:14px}
    .ocard:hover{border-color:var(--bdr2);box-shadow:var(--s2);transform:translateY(-1px)}
    .oavat{width:40px;height:40px;border-radius:50%;background:var(--surf);display:flex;align-items:center;justify-content:center;color:var(--t2);flex-shrink:0;font-size:.78rem;font-weight:700;font-family:var(--fd)}
    .obody{flex:1;min-width:0}
    .otop{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
    .ottl{font-weight:600;font-size:.925rem}
    .ometa{font-size:.8125rem;color:var(--t2);margin-bottom:10px;line-height:1.5}
    .ofoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .oprice{font-weight:700;font-size:.9rem}
    .oacts{margin-left:auto;display:flex;gap:8px}
    .oempty{text-align:center;padding:56px 24px;color:var(--t3)}
    .oloading{text-align:center;padding:40px;color:var(--t3);font-size:.875rem}

    .rind{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;color:var(--t3)}
    .rdot{width:6px;height:6px;border-radius:50%;background:var(--grn);animation:rpl 2s ease-in-out infinite;flex-shrink:0}
    @keyframes rpl{0%,100%{opacity:.4}50%{opacity:1}}

    .comm-box{background:#FBF4E6;border:1px solid #E8D9B0;border-radius:var(--rsm);padding:12px 14px;margin-bottom:14px;display:flex;align-items:flex-start;gap:10px}
    .comm-box-t{font-size:.8125rem;font-weight:600;color:var(--gld);margin-bottom:3px}
    .comm-box-d{font-size:.78rem;color:#8a6820;line-height:1.5}

    .odh{background:var(--off);border-radius:var(--rmd);padding:22px;margin-bottom:22px}
    .odtags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
    .odtitle{font-family:var(--fd);font-size:1.3rem;margin-bottom:10px;line-height:1.25}
    .odprice{font-family:var(--fd);font-size:1.9rem;color:var(--t1);margin-bottom:4px}
    .odmeta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
    .odmi{background:var(--surf);border-radius:var(--rsm);padding:11px 14px}
    .odml{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--t3);margin-bottom:3px}
    .odmv{font-size:.875rem;font-weight:500}
    .selcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--bdr);border-radius:var(--rmd);margin-bottom:18px}
    .selavat{width:42px;height:42px;border-radius:50%;background:var(--t1);color:var(--white);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:.95rem;font-weight:700;flex-shrink:0}
    .selname{font-weight:600;font-size:.9375rem;margin-bottom:3px}
    .selstat{font-size:.75rem;color:var(--t2)}
    .cform{background:var(--off);border-radius:var(--rmd);padding:18px;border:1.5px solid var(--bdr)}
    .cformtitle{font-weight:600;font-size:.875rem;margin-bottom:14px}

    .gate-banner{background:linear-gradient(135deg,#F3EEFF,#E8EEFB);border:1.5px solid #D4C8F0;border-radius:var(--rmd);padding:36px 24px;text-align:center}
    .gate-icon{width:52px;height:52px;background:var(--pur);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--white)}
    .gate-t{font-family:var(--fd);font-size:1.2rem;margin-bottom:7px}
    .gate-d{font-size:.875rem;color:var(--t2);margin-bottom:18px;line-height:1.6;max-width:380px;margin-left:auto;margin-right:auto}

    .crypto-gate-wrap{position:relative}
    .crypto-gate-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,0) 0%,rgba(255,255,255,.96) 35%,rgba(255,255,255,1) 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:36px;border-radius:0 0 var(--rmd) var(--rmd);pointer-events:none}
    .crypto-gate-overlay>div{pointer-events:all;text-align:center}

    #pg-sub{padding:60px 24px 80px;max-width:800px;margin:0 auto}
    .sub-badge{display:inline-flex;align-items:center;gap:6px;background:#F3EEFF;color:var(--pur);border:1px solid #D4C8F0;border-radius:100px;padding:6px 16px;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px}
    .sub-price{font-family:var(--fd);font-size:3rem;margin-bottom:6px}
    .sub-price span{font-size:1.1rem;color:var(--t2);font-family:var(--fb)}
    .sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:32px 0}
    .sub-feat{background:var(--white);border:1px solid var(--bdr);border-radius:var(--rmd);padding:20px}
    .sub-feat-i{width:36px;height:36px;border-radius:var(--rsm);background:#F3EEFF;color:var(--pur);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
    .sub-feat-t{font-weight:600;font-size:.9rem;margin-bottom:5px}
    .sub-feat-d{font-size:.8rem;color:var(--t2);line-height:1.5}
    .pay-card{background:var(--off);border:1.5px solid var(--bdr);border-radius:var(--rlg);padding:30px;max-width:500px;margin:0 auto}
    .pay-step{display:flex;gap:14px;margin-bottom:18px;align-items:flex-start}
    .pay-step-n{width:26px;height:26px;border-radius:50%;background:var(--t1);color:var(--white);font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
    .pay-step-t{font-weight:600;font-size:.875rem;margin-bottom:3px}
    .pay-step-d{font-size:.8rem;color:var(--t2);line-height:1.5}
    .pay-acct{background:var(--white);border:1px solid var(--bdr);border-radius:var(--rsm);padding:11px 14px;font-size:.8rem;margin-top:8px;font-family:monospace;line-height:1.6}
    .pay-acct strong{color:var(--t1);display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;font-family:var(--fb)}

    @media(max-width:768px){.pricing-grid{grid-template-columns:1fr}.plan-card.featured{transform:none}}

    .al-hero{background:linear-gradient(135deg,#0f0f0f,#1a1410 50%,#0f0f15);border-radius:var(--rmd);padding:26px 28px;margin-bottom:20px;border:1px solid rgba(255,255,255,.08)}

function ago(iso){
  const s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
  if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';

function fmtp(p){
  if(p==null||isNaN(p))return'—';
  if(p<0.0001)return'$'+p.toFixed(8);if(p<0.01)return'$'+p.toFixed(6);
  if(p<1)return'$'+p.toFixed(4);
  return'$'+p.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function mockBars(id,iv){
  const seed=[...id].reduce((a,c)=>a+c.charCodeAt(0),0);

async function loadAlData(){
  if(S.alLoading) return;
  S.alLoading=true; render();

  const syms=[
    {id:'gold',  yf:'GC=F'},    {id:'nvda',   yf:'NVDA'},
    {id:'spx',   yf:'^GSPC'},   {id:'btc',    yf:'BTC-USD'},
    {id:'dxy',   yf:'DX-Y.NYB'},{id:'eth',    yf:'ETH-USD'},
    {id:'tet',   yf:'TET-USD'}, {id:'mstr',   yf:'MSTR'},
    {id:'tsla',  yf:'TSLA'},    {id:'nasdaq', yf:'^IXIC'},
  ];

  await Promise.all(syms.map(async({id,yf})=>{
    try{
      const base=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(yf)}?interval=1mo&range=max`;
      const r=await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(base)}`);
      if(!r.ok) throw new Error(r.status);
      const data=await r.json();
      const res=data?.chart?.result?.[0];
      if(!res) return;
      const closes=res.indicators?.quote?.[0]?.close||[];
      const ts=res.timestamp||[];
      const valid=ts.map((t,i)=>({t,p:closes[i]})).filter(x=>x.p!=null);
      if(!valid.length) return;
      const cur=res.meta?.regularMarketPrice||valid[valid.length-1].p;
      const now=Date.now()/1000;
      const nearest=(target)=>{
        let best=null,bd=Infinity;
        for(const{t,p}of valid){const d=Math.abs(t-target);if(d<bd){bd=d;best=p;}}
        return best;
      };
      const pct=(old)=>old&&old>0?((cur-old)/old*100):null;
      const joinTs=S.user?.joinedAt?new Date(S.user.joinedAt).getTime()/1000:null;
      S.alPrices[id]={
        price      : result.meta?.regularMarketPrice || current,
        ytd        : pct(nearest(new Date(new Date().getFullYear(),0,1).getTime()/1000)),
        y6         : pct(nearest(new Date(2020,0,1).getTime()/1000)),
        y5         : pct(nearest(now-5*365.25*24*3600)),
        y10        : pct(nearest(now-10*365.25*24*3600)),
        sinceJoined: joinTs?pct(nearest(joinTs)):pct(valid[0].p),
      };
    }catch(e){console.warn('AL:',id,e.message);}
  }));

  const cgBtc=S.coins.find(c=>c.id==='bitcoin');
  const cgEth=S.coins.find(c=>c.id==='ethereum');
  if(cgBtc&&S.alPrices.btc) S.alPrices.btc.price=cgBtc.price;
  if(cgEth&&S.alPrices.eth) S.alPrices.eth.price=cgEth.price;
  const joinTs2=S.user?.joinedAt?new Date(S.user.joinedAt).getTime()/1000:null;
  if(S.alPrices.btc&&!S.alPrices.btc.sinceJoined) S.alPrices.btc.sinceJoined=joinTs2?null:-18.27;
  if(S.alPrices.eth&&!S.alPrices.eth.sinceJoined) S.alPrices.eth.sinceJoined=joinTs2?null:-35.05;

  S.alLoading=false; render();
}

  _mktTable(){
    if(S.coinsState==='loading'||S.coinsState==='idle'){
      return`<div class="mtwrap"><div class="lrow"><div class="spin"></div><br>Fetching 500 assets from CoinGecko…</div></div>`;
    }
    if(S.coinsState==='err'&&S.coins.length===0){
      return`<div class="mtwrap"><div class="lrow" style="color:var(--red)"><i data-lucide="alert-circle" style="width:24px;height:24px;display:block;margin:0 auto 10px"></i>Could not load market data.</div></div>`;
    }
    const q=S.csearch.toLowerCase().trim();
    const filtered=q?S.coins.filter(c=>c.name.toLowerCase().includes(q)||c.sym.toLowerCase().includes(q)):S.coins;
    const total=filtered.length;

    const tblRow=(c,i)=>{const pos=c.chg>=0;const st=S.watchlist.has(c.id);return`
      <tr onclick="A.openCoin('${c.id}')">
        <td style="color:var(--t3);font-size:.78rem">${c.rank||i+1}</td>

      </tr>`;};

    const thead=`<thead><tr><th style="width:38px">#</th><th>Asset</th><th class="r">Price</th><th class="r">24h</th><th class="r" style="width:48px">★</th></tr></thead>`;


    const pages=Math.max(1,Math.ceil(total/S.cps));
    const pg=Math.min(S.cpage,pages);
    const start=(pg-1)*S.cps;

        <div class="pgn">
          <span class="pgninf">Page ${pg} / ${pages} &nbsp;•&nbsp; ${total.toLocaleString()} assets</span>
          <div class="pgnc">
            <button class="pgbtn" onclick="A.cPage(${pg-1})" ${pg<=1?'disabled':''}><i data-lucide="chevron-left" style="width:13px;height:13px"></i></button>
            ${Array.from({length:Math.min(pages,maxPg)},(_,i)=>{const p=i+1;return`<button class="pgbtn ${p===pg?'on':''}" onclick="A.cPage(${p})">${p}</button>`;}).join('')}
            ${pages>maxPg?`<span style="padding:0 4px;color:var(--t3);font-size:.78rem">…${pages}</span>`:''}
            <button class="pgbtn" onclick="A.cPage(${pg+1})" ${pg>=pages?'disabled':''}><i data-lucide="chevron-right" style="width:13px;height:13px"></i></button>
          </div>
        </div>
      </div>`;
  },

  _deepdive(){
    const coin=S.coins.find(c=>c.id===S.selCoin);
    if(!coin)return'<p style="padding:40px;color:var(--t2)">Asset not found.</p>';
    const idx=S.coins.indexOf(coin);const pos=coin.chg>=0;const iv=S.interval;
    const bars=mockBars(coin.id,iv);const maxH=Math.max(...bars.map(b=>b.h));
    const mets=mockMetrics(coin.id,iv);
    const xlabels={ytd:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],'5y':['2020','2021','2022','2023','2024'],'10y':['2015','2016','2017','2018','2019','2020','2021','2022','2023','2024']};
    const st=S.watchlist.has(coin.id);const[bg,fg]=COLORS[idx%COLORS.length];
    return`
      <button class="back" onclick="A.setCryptoSub('market')"><i data-lucide="arrow-left" style="width:15px;height:15px"></i>Back to Market</button>

const R = {
  go(page){
    stopAR();
    S.page=page;
    if(page==='market'){S.mTab='board';S.mFilter='all';loadOrders();startAR();}
    if(page==='crypto'&&S.coinsState==='idle') loadCoins();
    render();

const A = {
  authTab(t){ S.authTab=t; M.auth(); },
  setUType(t){ S.signupType=t; M.auth(); },

  async login(){
    const email=document.getElementById('lemail')?.value?.trim();
    const pwd=document.getElementById('lpwd')?.value;
    const err=document.getElementById('lerr');
    const btn=document.getElementById('lbtn');
    if(!email||!pwd){err.textContent='Please fill in all fields.';return;}
    btn.disabled=true;btn.textContent='Signing in…';
    try{
      await DB.login(email,pwd);
      const u=await DB.me();if(!u)throw new Error('No session');
      const res=await DB.list('profiles',[Query.equal('userId',[u.$id]),Query.limit(1)]);
      const p=res.documents[0];
      S.user={id:u.$id,name:p?.name||u.name,email:u.email,type:p?.type||'B',inits:initials(p?.name||u.name),joinedAt:u.$createdAt};
      await Promise.all([loadWatchlist(),loadSubscription(),loadVerifyStatus(),loadMyConnections(),loadSentConnections()]);
      M.close();R.go('profile');
      toast('Welcome back, '+S.user.name.split(' ')[0]+'!','ok');
    }catch(e){
      err.textContent='Login failed: '+(e.message.includes('401')||e.message.includes('invalid')?'Wrong email or password.':e.message);
      btn.disabled=false;btn.textContent='Sign In';
    }
  },

  async signup(){
    const name=document.getElementById('sname')?.value?.trim();
    const email=document.getElementById('semail')?.value?.trim();
    const pwd=document.getElementById('spwd')?.value;
    const type=S.signupType;
    const err=document.getElementById('serr');
    const btn=document.getElementById('sbtn');
    if(!name||!email||!pwd){err.textContent='Please fill in all fields.';return;}
    if(!type){err.textContent='Please select an account type.';return;}
    btn.disabled=true;btn.textContent='Creating account…';
    try{
      const u=await DB.register(email,pwd,name);
      await DB.login(email,pwd);
      await DB.create('profiles',{userId:u.$id,name,email,type});
      S.user={id:u.$id,name,email,type,inits:initials(name),joinedAt:new Date().toISOString()};
      S.subscribed=false;S.subStatus=null;S.verifyStatus=null;S.myConnections=[];S.sentConnections=[];
      M.close();R.go('profile');
      toast('Account created! Welcome, '+name.split(' ')[0]+'.','ok');
    }catch(e){
      err.textContent='Signup failed: '+(e.message.includes('409')?'Email already in use.':e.message);
      btn.disabled=false;btn.textContent='Create Account';
    }
  },

  async logout(){
    await DB.logout();
    S.user=null;S.watchlist=new Set();S.wlDocId=null;
    S.subscribed=false;S.subStatus=null;S.verifyStatus=null;S.myConnections=null;
    stopAR();R.go('land');
    toast('You have been signed out.');
  },

  setMTab(t){
    if(t==='forum'&&!S.subscribed){M.subscribe();return;}
    S.mTab=t;
    if(t==='board') loadOrders();
    if(t==='forum') loadChat();
    render();
  },
  setFilter(f){ S.mFilter=f; render(); },

  async viewOrder(id){
    if(!S.subscribed){M.subscribe();return;}
    const o=(S.orders||[]).find(x=>x.id===id);
    if(!o) return;
    S.viewedOrder=o;
    S.viewedOrderReviews=[];
    S.viewedOrderConnection=null;

    const isResolved=o.status==='filled'||o.status==='closed';
    if(isResolved){
      try{
        // fetch the connection that completed this order
        const cRes=await DB.list('connections',[
          Query.equal('orderId',[id]),
          Query.limit(10),
        ]);
        const matched=cRes.documents.find(d=>
          d.status==='deal_done'||d.status==='comm_pending'||d.status==='comm_paid'
        );
        if(matched){
          S.viewedOrderConnection={
            fromName      : matched.fromName||'a buyer',
            fromInitials  : matched.fromInitials||'?',
            finalPrice    : matched.finalPrice,
            commissionAmt : matched.commissionAmt,
            status        : matched.status,
          };
        }
      }catch(e){console.warn('viewOrder conn fetch:',e);}

      try{
        const rRes=await DB.list('reviews',[
          Query.equal('orderId',[id]),
          Query.orderDesc('$createdAt'),
          Query.limit(10),
        ]);
        S.viewedOrderReviews=rRes.documents.map(d=>({
          id:d.$id,
          reviewerName    : d.reviewerName,
          reviewerInitials: d.reviewerInitials,
          rating          : d.rating,
          comment         : d.comment,
          createdAt       : d.$createdAt,
        }));
      }catch(e){console.warn('viewOrder review fetch:',e);}
    }
    M.viewOrder(o);
  },

  connectOrder(id){
    if(!S.user){M.auth();toast('Please sign in to connect.');return;}
    if(!S.subscribed){M.subscribe();return;}
    const o=(S.orders||[]).find(x=>x.id===id);
    if(!o) return;
    S.viewedOrder=o; M.viewOrder(o);
    setTimeout(()=>{
      const cf=document.querySelector('.cform');
      if(cf)cf.scrollIntoView({behavior:'smooth',block:'start'});
      document.getElementById('cmsg')?.focus();
    },150);
  },

  async submitConnect(orderId,toUserId,toName,orderTitle,commission){
    if(!S.user) return;
    const msg=document.getElementById('cmsg')?.value?.trim();
    const contact=document.getElementById('ccontact')?.value?.trim();
    const err=document.getElementById('cerr');
    const btn=document.getElementById('cbtn');
    if(!msg){err.textContent='Please write a message.';return;}
    if(!contact){err.textContent='Please provide your contact details.';return;}
    btn.disabled=true;btn.textContent='Sending…';
    try{
      await DB.create('connections',{
        orderId, orderTitle,
        fromUserId:S.user.id, fromName:S.user.name, fromInitials:S.user.inits,
        toUserId, toName,
        message:msg, contact, commission, status:'pending',
      });
      M.close();
      toast('Connection request sent to '+toName.split(' ')[0]+'! They will see it in their inbox.','ok');
    }catch(e){
      err.textContent='Failed: '+e.message;
      btn.disabled=false;btn.textContent='Send Request';
    }
  },

  async submitOrder(){
    const unpaid=(S.myConnections||[]).filter(c=>c.status==='deal_done'||c.status==='comm_pending').length;
    if(unpaid>=3){
      const go=confirm(`You have ${unpaid} deals with outstanding commission. Please settle these to maintain your standing. Continue posting anyway?`);
      if(!go) return;
    }
    const title=document.getElementById('otitle')?.value?.trim();
    const cat=document.getElementById('ocat')?.value;
    const type=document.getElementById('otype')?.value;
    const rawP=document.getElementById('oprice')?.value?.trim();
    const desc=document.getElementById('odesc')?.value?.trim();
    const err=document.getElementById('oerr');
    const btn=document.getElementById('obtn');
    if(!title){err.textContent='Please add a title.';return;}
    if(!cat){err.textContent='Please select a category.';return;}
    if(!rawP){err.textContent='Please add a price or budget.';return;}
    const lower=rawP.toLowerCase();
    const price=lower==='negotiable'?'Negotiable':(rawP.startsWith('$')?rawP:'$'+rawP);
    btn.disabled=true;btn.textContent='Posting…';
    const inits2=initials(S.user.name);
    try{
      const doc=await DB.create('orders',{
        userId:S.user.id,userName:S.user.name,userInitials:inits2,
        category:cat,type,title,price,desc:desc||'',status:'open',
      });
      if(!S.orders)S.orders=[];
      S.orders.unshift({id:doc.$id,userId:S.user.id,userName:S.user.name,
        userInitials:inits2,category:cat,type,title,price,
        desc:desc||'',status:'open',createdAt:doc.$createdAt||new Date().toISOString()});
      M.close();render();
      toast('Listing posted!','ok');
    }catch(e){
      err.textContent='Failed: '+e.message;
      btn.disabled=false;btn.textContent='Post Listing';
    }
  },

  async sendMsg(){
    const inp=document.getElementById('cinput');
    const txt=inp?.value?.trim();
    if(!txt||!S.user) return;
    inp.value='';
    const now=new Date().toISOString();
    if(!S.msgs)S.msgs=[];
    S.msgs.push({id:'l'+Date.now(),userId:S.user.id,userName:S.user.name,inits:S.user.inits,text:txt,own:true,ts:now});
    render();
    DB.create('chat',{userId:S.user.id,userName:S.user.name,initials:S.user.inits,text:txt})
      .catch(e=>console.warn('chat:',e.message));
  },

  async submitSub(){
    const ref=document.getElementById('subref')?.value?.trim();
    const method=document.getElementById('submethod')?.value;
    const err=document.getElementById('suberr');
    const btn=document.getElementById('subbtn');
    if(!ref){err.textContent='Please enter your payment reference.';return;}
    if(!method){err.textContent='Please select your payment method.';return;}
    btn.disabled=true;btn.textContent='Submitting…';
    try{
      await DB.create('subscription',{userId:S.user.id,status:'pending',plan:'monthly',amount:'5',reference:ref,paymentMethod:method});
      S.subStatus='pending';
      toast('Reference submitted! Access granted within 24 hours.','ok');
      render();
    }catch(e){
      err.textContent='Failed: '+e.message;
      btn.disabled=false;btn.textContent='Submit Payment Reference';
    }
  },

  async submitVerify(){
    const name=document.getElementById('vidname')?.value?.trim();
    const idType=document.getElementById('vidtype')?.value;
    const idNum=document.getElementById('vidnum')?.value?.trim();
    const note=document.getElementById('vidnote')?.value?.trim();
    const err=document.getElementById('verr');
    const btn=document.getElementById('vbtn');
    if(!name){err.textContent='Please enter your full name.';return;}
    if(!idType){err.textContent='Please select an ID type.';return;}
    if(!idNum){err.textContent='Please enter your ID number.';return;}
    btn.disabled=true;btn.textContent='Submitting…';
    try{
      await DB.create('verifications',{userId:S.user.id,fullName:name,idType,idNumber:idNum,note:note||'',status:'pending'});
      S.verifyStatus='pending';
      M.close();render();
      toast('Verification submitted! Review within 24–48 hours.','ok');
    }catch(e){
      err.textContent='Failed: '+e.message;
      btn.disabled=false;btn.textContent='Submit for Verification';
    }
  },

  async reloadConnections(){
    await Promise.all([loadMyConnections(),loadSentConnections()]);render();toast('Inbox refreshed.');
  },

  async acceptConn(id){
    try{await DB.update('connections',id,{status:'accepted'});await loadMyConnections();render();toast('Connection accepted!','ok');}
    catch(e){toast('Failed: '+e.message,'err');}
  },
  async declineConn(id){ /* replaced by showDeclineForm flow */ },
  showDeclineForm(id){
    const el=document.getElementById('decline-form-'+id);
    if(el) el.style.display=el.style.display==='none'?'block':'none';
  },
  async submitDecline(id){
    const sel=document.getElementById('decline-reason-'+id);
    const reason=sel?.value;
    if(!reason){toast('Please select a reason.','err');return;}
    const btn=document.getElementById('decline-btn-'+id);
    if(btn){btn.disabled=true;btn.textContent='Declining…';}
    try{
      await DB.update('connections',id,{status:'declined',declineReason:reason});
      await loadMyConnections();render();
      toast('Connection declined.');
    }catch(e){
      toast('Failed: '+e.message,'err');
      if(btn){btn.disabled=false;btn.textContent='Confirm Decline';}
    }
  },
  setReviewRating(n){ S._reviewRating=n; render(); },
  async submitReview(connId,orderId,sellerId,sellerName){
    const rating=S._reviewRating;
    const comment=document.getElementById('review-comment-'+connId)?.value?.trim();
    if(!rating){toast('Please select a star rating.','err');return;}
    const btn=document.getElementById('review-btn-'+connId);
    if(btn){btn.disabled=true;btn.textContent='Submitting…';}
    try{
      await DB.create('reviews',{
        orderId,connectionId:connId,
        reviewerId:S.user.id,reviewerName:S.user.name,reviewerInitials:S.user.inits,
        sellerId,sellerName,rating,comment:comment||'',
      });
      if(S.sentConnections){
        const c=S.sentConnections.find(x=>x.id===connId);
        if(c) c.reviewed=true;
      }
      S._reviewRating=0;
      render();
      toast('Review submitted! Thank you.','ok');
    }catch(e){
      toast('Failed: '+e.message,'err');
      if(btn){btn.disabled=false;btn.textContent='Submit Review';}
    }
  },
  showDealForm(id){
    const el=document.getElementById('deal-form-'+id);
    if(el)el.style.display=el.style.display==='none'?'block':'none';
  },
  async submitDealDone(id){
    const inp=document.getElementById('deal-price-'+id);
    const rawVal=inp?.value||'';
    const fp=parseFloat(rawVal.replace(/[^0-9.]/g,''));
    if(!fp||isNaN(fp)||fp<=0){toast('Please enter the final agreed price.','err');return;}
    const comm=(fp*0.02).toFixed(2);
    const btn=document.getElementById('deal-btn-'+id);
    if(btn){btn.disabled=true;btn.textContent='Saving…';}

    // Pull connection from local state BEFORE any await
    const allConns=S.myConnections||[];
    const conn=allConns.find(x=>x.id===id);
    const orderId=conn?.orderId||null;
    const buyerNameVal=conn?.fromName||'';

    try{
      // Step 1: update the connection
      await DB.update('connections',id,{
        status     : 'deal_done',
        finalPrice : fp,
        commissionAmt: '$'+comm,
        buyerName  : buyerNameVal,
      });

      // Step 2: update the order to filled
      if(orderId){
        await DB.update('orders',orderId,{status:'filled'});
        // reflect immediately in local state (if market was already loaded)
        if(S.orders){
          const ord=S.orders.find(x=>x.id===orderId);
          if(ord) ord.status='filled';
        }
      }

      await loadMyConnections();
      render();
      toast('Deal marked complete. Commission due: $'+comm,'ok');
    }catch(e){
      console.error('submitDealDone error:',e);
      toast('Error: '+e.message,'err');
      if(btn){btn.disabled=false;btn.textContent='Confirm';}
    }
  },
  showCommForm(id){
    const el=document.getElementById('comm-form-'+id);
    if(el)el.style.display=el.style.display==='none'?'block':'none';
  },
  async submitCommission(id){
    const ref=document.getElementById('comm-ref-'+id)?.value?.trim();
    if(!ref){toast('Please enter your payment reference.','err');return;}
    const btn=document.getElementById('comm-btn-'+id);
    if(btn){btn.disabled=true;btn.textContent='Submitting…';}
    try{
      await DB.update('connections',id,{status:'comm_pending',commissionRef:ref});
      await loadMyConnections();render();
      toast('Submitted! We will verify within 24 hours.','ok');
    }catch(e){
      toast('Failed: '+e.message,'err');
      if(btn){btn.disabled=false;btn.textContent='I Have Paid';}
    }
  },
  async confirmDeal(id){
    try{
      await DB.update('connections',id,{buyerConfirmed:true});
      await loadSentConnections();render();
      toast('Deal confirmed. Thank you!','ok');
    }catch(e){toast('Failed: '+e.message,'err');}
  },
  async adminVerifyComm(id){
    if(S.user?.id!==ADMIN_ID) return;
    try{
      await DB.update('connections',id,{status:'comm_paid'});
      await loadMyConnections();render();
      toast('Commission verified and marked as paid.','ok');
    }catch(e){toast('Failed: '+e.message,'err');}
  },
  async adminLoadAll(){
    if(S.user?.id!==ADMIN_ID) return;
    const r=await DB.list('connections',[Query.orderDesc('$createdAt'),Query.limit(200)]);
    S._adminConns=r.documents.map(d=>({
      id:d.$id,fromName:d.fromName,toName:d.toName,
      orderTitle:d.orderTitle,status:d.status,
      commissionAmt:d.commissionAmt,commissionRef:d.commissionRef,
      buyerConfirmed:d.buyerConfirmed,createdAt:d.$createdAt,
    }));
    render();
    toast('Admin data refreshed.');
  },

  setCryptoSub(s){
    S.cryptoSub=s;
    if(s==='assetlist'&&!S.alLoading&&Object.keys(S.alPrices).length===0) loadAlData();
    render();
  },
  setIv(iv){ S.interval=iv; render(); },
  cSearch(q){ S.csearch=q; S.cpage=1; render(); },
  cPage(p){
    const q=S.csearch.toLowerCase().trim();
    const coins=q?S.coins.filter(c=>c.name.toLowerCase().includes(q)||c.sym.toLowerCase().includes(q)):S.coins;
    const pages=Math.max(1,Math.ceil(coins.length/S.cps));
    if(p<1||p>pages) return;
    S.cpage=p;render();
  },
  openCoin(id){ S.selCoin=id;S.cryptoSub='deepdive';S.interval='ytd';render(); },
  toggleWatch(id){
    S.watchlist.has(id)?S.watchlist.delete(id):S.watchlist.add(id);
    saveWatchlist();
    if(S.cryptoSub==='deepdive'||S.cryptoSub==='watchlist'){render();return;}
    document.querySelectorAll('.wbtn').forEach(b=>{
      if((b.getAttribute('onclick')||'').includes("'"+id+"'")){
        const on=S.watchlist.has(id);
        b.className='wbtn'+(on?' on':'');
        const ic=b.querySelector('i');
        if(ic)ic.setAttribute('style','width:15px;height:15px;'+(on?'fill:currentColor':''));
      }
    });
    lucide.createIcons();
  },
};

const PAY = {

  withFlutterwave(){
    if(!S.user){ M.auth(); return; }
    if(!_hasFwKey){
      toast('Payment not configured yet — config.js missing.','err');
      console.warn('Set FW_PUBLIC_KEY in config.js');
      return;
    }
    const ref = 'TMC-' + S.user.id.slice(0,8) + '-' + Date.now();
    FlutterwaveCheckout({
      public_key   : TMC.FW_PUBLIC_KEY,
      tx_ref       : ref,
      amount       : 5,
      currency     : 'USD',
      payment_options: 'card, banktransfer, ussd',
      customer: {
        email: S.user.email,
        name : S.user.name,
      },
      customizations: {
        title      : 'Toomuchcoin Pro',
        description: '$5/month — Full platform access',
        logo       : '',
      },
      callback: async function(data){
        if(data.status === 'successful' || data.status === 'completed'){
          try{
            await DB.create('subscription',{
              userId       : S.user.id,
              status       : 'active',
              plan         : 'monthly',
              amount       : '5',
              reference    : data.transaction_id + '',
              paymentMethod: 'flutterwave',
            });
            S.subStatus  = 'active';
            S.subscribed = true;
            M.close();
            render();
            toast('Payment successful! Pro access activated.','ok');
          }catch(e){ toast('Payment received but activation failed — contact support.','err'); }
        } else {
          toast('Payment was not completed.','err');
        }
      },
      onclose: function(){
      },
    });
  },

  async withCrypto(){
    if(!S.user){ M.auth(); return; }
    if(!_hasFnId){
      toast('Crypto payment not configured yet.','err');
      console.warn('Set APPWRITE_FN_ID in config.js');
      return;
    }
    const btn = document.getElementById('cryptoPayBtn');
    if(btn){ btn.disabled=true; btn.textContent='Creating invoice…'; }
    try{
      const ref = 'TMC-CRYPTO-' + S.user.id.slice(0,8) + '-' + Date.now();
      const result = await _db.createExecution(
        TMC.APPWRITE_FN_ID,
        JSON.stringify({ userId: S.user.id, email: S.user.email, name: S.user.name, ref }),
        false
      );
      const body = JSON.parse(result.responseBody || '{}');
      if(body.error) throw new Error(body.error);
      if(body.checkout_url){
        await DB.create('subscription',{
          userId:'pending_'+S.user.id, status:'pending', plan:'monthly',
          amount:'5', reference:ref, paymentMethod:'ivorypay',
          userId: S.user.id,
        });
        S.subStatus = 'pending';
        render();
        window.open(body.checkout_url, '_blank');
        toast('Crypto checkout opened in new tab. Access granted after confirmation.','ok');
      }
    }catch(e){
      toast('Could not create crypto invoice: '+e.message,'err');
      if(btn){ btn.disabled=false; btn.textContent='Pay with Crypto (USDT)'; }
    }
  },
};

document.addEventListener('DOMContentLoaded', async()=>{
  const u=await DB.me();
  if(u){
    const res=await DB.list('profiles',[Query.equal('userId',[u.$id]),Query.limit(1)]);
    const p=res.documents[0];
    S.user={id:u.$id,name:p?.name||u.name,email:u.email,type:p?.type||'B',inits:initials(p?.name||u.name),joinedAt:u.$createdAt};
    await Promise.all([loadWatchlist(),loadSubscription(),loadVerifyStatus(),loadMyConnections(),loadSentConnections()]);
  }
  render();
  loadCoins();
});
